name: netcore-n60-pro-immortal-dual

# 单 job 出两种分区固件：
#   1) 用 netcore-n60-pro-immortal-506m.sh 做 DIY，完整编译产出 506.5MB 固件
#   2) 复用已编译的工具链 / 软件包，只把 DTS 的 ubi 改成 490MB，重建 dtb/kernel/镜像
#
# 文件分工（避免混淆）：
#   DIY_SCRIPT = netcore-n60-pro-immortal-506m.sh   可执行，本 workflow 唯一会跑的 DIY 脚本
#   DIY_LIB    = netcore-n60-pro-diy-lib.sh         函数库，只被 source（改 IP / 改 DTS；内嵌工具函数为可选）
#   netcore-n60-pro-immortal-490m.sh                可执行，仅供本地单独构建 490MB 用，本 workflow 不执行它
#
# 固件内容：预装 momo + easytier 本体及其中文 LuCI，其余代理工具（meow / nikki 等）不预装，
# 只在 configs 里预置它们运行所需的 kmod 与用户态工具（见 configs 末尾的依赖清单）。
#
# 第三方包源（不走 feed，整仓 clone 到 package/ 下，见 Clone Third-party Packages 步骤）：
#   package/easytier <- https://github.com/EasyTier/luci-app-easytier
#   package/momo     <- https://github.com/nikkinikki-org/OpenWrt-momo
# 注意：必须在 Install Feeds 之后 clone——两个 luci-app-* 的 Makefile 要 include feeds/luci/luci.mk。
#
# 变体一致性：两个 Release 是分开的两次上传，中途被取消会出现 506m 新 / 490m 旧。
# 因此上传前会校验两个镜像内容必须不同（见 Verify Variants Differ），并在结束时校验两目录非空。
# 前置要求：configs/netcore-n60-pro-immortal.config 里不能有 CONFIG_IB / CONFIG_IB_STANDALONE / CONFIG_SDK

on:
  workflow_dispatch:
  watch:
    types: [started]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: master
  CONFIG_FILE: configs/netcore-n60-pro-immortal.config
  DIY_SCRIPT: netcore-n60-pro-immortal-506m.sh
  DIY_LIB: netcore-n60-pro-diy-lib.sh
  CACHE_TOOLCHAIN: 'true'
  TZ: Asia/Shanghai
  DTS_PATH: target/linux/mediatek/dts/mt7986a-netcore-n60-pro.dts
  DTB_NAME: image-mt7986a-netcore-n60-pro.dtb
  KERNEL_BIN: netcore_n60-pro-kernel.bin
  DEVICE_GLOB: '*n60-pro*'
  DEVICE_SYMBOL: CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro
  # defconfig 之后必须仍然存在的关键包（丢了说明 feeds / 第三方包源 / DIY 出错）：
  #   sing-box 本体 + 代理工具所需 kmod
  #   easytier 本体与中文 LuCI
  #   momo 本体与中文 LuCI
  MUST_KEEP_PACKAGES: >-
    CONFIG_PACKAGE_sing-box CONFIG_PACKAGE_kmod-tun CONFIG_PACKAGE_kmod-nft-tproxy
    CONFIG_PACKAGE_easytier CONFIG_EASYTIER_INCLUDE_WEBCONSOLE
    CONFIG_PACKAGE_luci-app-easytier CONFIG_PACKAGE_luci-i18n-easytier-zh-cn
    CONFIG_PACKAGE_momo CONFIG_PACKAGE_luci-app-momo CONFIG_PACKAGE_luci-i18n-momo-zh-cn
  UBI_506M: 0x0580000 0x1fa80000
  UBI_490M: 0x0580000 0x1ea00000
  TAG_506M: netcore-n60pro-immortal-506m
  TAG_490M: netcore-n60pro-immortal-490m

jobs:
  build:
    name: Build N60 Pro (506M + 490M)
    runs-on: ubuntu-24.04
    # workflow_dispatch 随时可跑；watch（star 触发）默认不限制触发人。
    # 想在公开仓库里只允许特定账号点星触发，就配仓库变量 STAR_ACTOR=<用户名>，
    # 配了之后只有该账号的 star 才会启动编译。
    if: github.event_name == 'workflow_dispatch' || vars.STAR_ACTOR == '' || github.actor == vars.STAR_ACTOR
    # 两遍编译（第二遍只重建 kernel/dtb/镜像），显式超时比被系统 kill 更好排查
    timeout-minutes: 350

    steps:
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install $(curl -fsSL --retry 3 ophub.org/ubuntu2404-make-openwrt-depends)
          sudo -E apt-get -y install device-tree-compiler unzip
          sudo timedatectl set-timezone "$TZ"
          sudo systemctl daemon-reload

      - name: Combine Disks
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # 注意：maximize-build-space 会重建 workspace 挂载点，必须放在 checkout 之前，
      # 否则已检出的 configs/、DIY 脚本会被清空（报 cp: cannot stat ...）
      - name: Checkout
        uses: actions/checkout@main

      - name: Verify Repo Files
        run: |
          for f in "$CONFIG_FILE" "$DIY_SCRIPT" "$DIY_LIB"; do
            [ -f "$f" ] || { echo "ERROR: 缺少 $f"; ls -al; exit 1; }
          done

      - name: Clone Source Code
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          echo "OPENWRT_PATH=$PWD/openwrt" >> $GITHUB_ENV
          echo "SOURCE_COMMIT=$(git -C openwrt rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "SOURCE_DATE=$(git -C openwrt show -s --date=short --format=%cd)" >> $GITHUB_ENV

      - name: Clone package
        run: |
          cd openwrt
          # 只加明确定义的第三方 feed
          sed -i '1i src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' feeds.conf.default

      - name: Generate Variables
        run: |
          cp $CONFIG_FILE $OPENWRT_PATH/.config
          cd $OPENWRT_PATH
          make defconfig > /dev/null 2>&1

          echo "SOURCE_REPO=$(echo $REPO_URL | awk -F '/' '{print $(NF)}')" >> $GITHUB_ENV
          echo "DEVICE_TARGET=$(grep '^CONFIG_TARGET_BOARD' .config | awk -F '"' '{print $2}')" >> $GITHUB_ENV
          echo "DEVICE_SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET' .config | awk -F '"' '{print $2}')" >> $GITHUB_ENV

          # 守卫 1：CONFIG_IB / CONFIG_IB_STANDALONE / CONFIG_SDK 任一为 y 都会让 subtarget 下
          # 所有设备的内核参与构建（会把 keenetic_kn-1012 拉进来并因缺 u-boot.bin 失败）
          if grep -qE '^CONFIG_(IB|IB_STANDALONE|SDK)=y' .config; then
            grep -E '^CONFIG_(IB|IB_STANDALONE|SDK)=y' .config
            echo "ERROR: .config 中开启了 CONFIG_IB / CONFIG_IB_STANDALONE / CONFIG_SDK，请从 $CONFIG_FILE 中删除"
            exit 1
          fi
          # 守卫 2：必须且只能是 netcore_n60-pro 一个设备
          echo "selected device count = $(grep -c '^CONFIG_TARGET_[a-z0-9_]*_DEVICE_.*=y$' .config || true)"
          if ! grep -q "^${DEVICE_SYMBOL}=y" .config; then
            echo "ERROR: 未选中目标设备（$DEVICE_SYMBOL）"
            exit 1
          fi
          grep '^CONFIG_TARGET_.*_DEVICE_.*=y$' .config

      - name: Cache Toolchain
        if: env.CACHE_TOOLCHAIN == 'true'
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: 'false'
          mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
          prefix: ${{ env.OPENWRT_PATH }}

      - name: Install Feeds
        run: |
          cd $OPENWRT_PATH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 必须放在 Install Feeds 之后：两个 luci-app-* 的 Makefile 要 include feeds/luci/luci.mk，
      # 早于 feeds 安装会被扫描失败，且失败结果会缓存进 tmp/info，后面 feeds 装好了也不会自愈。
      - name: Clone Third-party Packages
        run: |
          cd $OPENWRT_PATH
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git package/easytier
          git clone --depth 1 https://github.com/nikkinikki-org/OpenWrt-momo.git package/momo

          # easytier 与 easytier-noweb 提供的是同一批可执行文件，二者互斥，只保留带 web 面板的 easytier
          rm -rf package/easytier/easytier-noweb

          # 目录结构变了就在这里炸掉，不要留到 make defconfig 时静默丢包
          for d in package/easytier/easytier/Makefile \
                   package/easytier/luci-app-easytier/Makefile \
                   package/momo/momo/Makefile \
                   package/momo/luci-app-momo/Makefile; do
            [ -f "$d" ] || { echo "ERROR: 第三方包目录缺失 $d"; ls -R package/easytier package/momo 2>/dev/null | head -40; exit 1; }
          done

          # luci.mk 此时必须已存在，否则后面必然再丢 luci 包
          [ -f feeds/luci/luci.mk ] || { echo "ERROR: feeds/luci/luci.mk 不存在，luci-app-* 无法解析"; ls feeds/luci | head; exit 1; }

          # 关键：丢弃前面那次 make defconfig 生成的包索引缓存，强制重新扫描 package/ 与 feeds/
          rm -rf tmp/info tmp/.config-package.in tmp/.packageinfo tmp/.packagedeps \
                 tmp/.config-feeds.in tmp/.config-target.in
          echo "包索引缓存已清理，下一次 make 会重新扫描"

      - name: Load Custom Configuration
        run: |
          cp -f $CONFIG_FILE $OPENWRT_PATH/.config
          # 合并 pppoe-files 到 files/（用 cp -a 而不是 mv，避免 files/ 已存在时嵌套一层）
          if [ -d pppoe-files ]; then
            mkdir -p $OPENWRT_PATH/files
            cp -a pppoe-files/. $OPENWRT_PATH/files/
            chmod +x $OPENWRT_PATH/files/* 2>/dev/null || true
          fi

      - name: Mod Script
        run: |
          chmod +x $DIY_SCRIPT
          cd $OPENWRT_PATH
          $GITHUB_WORKSPACE/$DIY_SCRIPT

      - name: Download DL Package
        run: |
          cd $OPENWRT_PATH
          # DIY 换掉了 golang / sing-box，make defconfig 可能悄悄丢弃已选项：
          # 先存一份快照做 diff（丢弃的符号打 WARNING），再对关键插件做硬校验
          cp .config /tmp/config.pre-defconfig
          make defconfig
          comm -23 \
            <(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y' /tmp/config.pre-defconfig | sort -u) \
            <(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y' .config | sort -u) > /tmp/config.lost || true
          if [ -s /tmp/config.lost ]; then
            echo "WARNING: make defconfig 丢弃了以下已选项（换源后符号变化属正常，但需确认）："
            cat /tmp/config.lost
          fi
          # 关键插件必须还在，否则说明 feeds / 第三方包源 / DIY 出了问题
          for sym in $MUST_KEEP_PACKAGES; do
            if ! grep -q "^${sym}=y" .config; then
              echo "ERROR: defconfig 后 ${sym} 丢失，请检查 feeds/DIY"
              echo "---------- 诊断信息 ----------"
              ls -l feeds/luci/luci.mk 2>/dev/null || echo "feeds/luci/luci.mk 不存在"
              ls -d package/easytier/* package/momo/* 2>/dev/null || echo "第三方包目录缺失"
              grep -n "^config PACKAGE_${sym#CONFIG_PACKAGE_}$" tmp/.config-package.in 2>/dev/null \
                || echo "tmp/.config-package.in 中没有该符号（未被索引）"
              grep -n "^config ${sym#CONFIG_}" tmp/.config-package.in 2>/dev/null || true
              echo "------------------------------"
              exit 1
            fi
          done

          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # ============ 第一遍：506.5MB 分区，完整编译 ============
      - name: Build Firmware (506M)
        run: |
          cd $OPENWRT_PATH
          echo "nproc = $(nproc)"
          make -j$(nproc) || make -j1 || make -j1 V=s

      # 校验的是编译产物 DTB（$DTB_NAME），不是源码 DTS。
      # dtc 反编译出来的 reg 是十六进制，且前导 0 会被规范化（0x0580000 -> 0x580000），
      # 因此必须按数值比较，不能做字符串比较（用十进制串 grep 也必然不匹配）。
      - name: Verify DTB Partition (506M)
        env:
          EXPECT_UBI_OFFSET: '0x0580000'
          EXPECT_UBI_SIZE: '0x1fa80000'
        run: |
          cd $OPENWRT_PATH
          DTB=$(find build_dir -name "$DTB_NAME" 2>/dev/null | head -1) || true
          [ -n "$DTB" ] || { echo "ERROR: 未找到编译产出的 dtb"; exit 1; }
          DTS=$(dtc -I dtb -O dts "$DTB")
          printf '%s\n' "$DTS" | grep -A3 'label = "ubi"'
          REG=$(printf '%s\n' "$DTS" | grep -A3 'label = "ubi"' \
                | sed -n 's/.*reg = <\([^>]*\)>.*/\1/p' | head -1)
          [ -n "$REG" ] || { echo "ERROR: 无法从 dtb 中解析出 ubi 的 reg（节点结构可能变了）"; exit 1; }
          set -- $REG
          [ $# -ge 2 ] || { echo "ERROR: ubi reg 格式异常: <$REG>"; exit 1; }
          OFF=$(( $1 )); SIZE=$(( $2 ))
          EXP_OFF=$(( $EXPECT_UBI_OFFSET )); EXP_SIZE=$(( $EXPECT_UBI_SIZE ))
          echo "ubi offset=$OFF ($(printf '0x%x' "$OFF")), size=$SIZE ($(printf '0x%x' "$SIZE"))"
          echo "expect offset=$EXP_OFF ($EXPECT_UBI_OFFSET), size=$EXP_SIZE ($EXPECT_UBI_SIZE)"
          [ "$OFF"  -eq "$EXP_OFF"  ] || { echo "ERROR: ubi offset 不是 $EXPECT_UBI_OFFSET（实际 $(printf '0x%x' "$OFF")）"; exit 1; }
          [ "$SIZE" -eq "$EXP_SIZE" ] || { echo "ERROR: ubi size 不是 $EXPECT_UBI_SIZE（实际 $(printf '0x%x' "$SIZE")）"; exit 1; }
          echo "OK: ubi = <$EXPECT_UBI_OFFSET $EXPECT_UBI_SIZE>"
          echo "DTB_SHA_506M=$(sha256sum "$DTB" | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Collect Firmware (506M)
        env:
          SIZE: 506m
        run: |
          cd $OPENWRT_PATH
          OUT=$GITHUB_WORKSPACE/fw/$SIZE
          rm -rf "$OUT"; mkdir -p "$OUT"
          shopt -s nullglob
          n=0
          for f in bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET/$DEVICE_GLOB; do
            base=$(basename "$f"); stem="${base%.*}"; ext="${base##*.}"
            cp -f "$f" "$OUT/${stem}-${SIZE}.${ext}"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "ERROR: 未收集到固件"; ls -l bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET || true; exit 1; }
          cp -f .config "$OUT/build-${SIZE}.config" || true
          ( cd "$OUT" && sha256sum * > "sha256sums-${SIZE}.txt" )
          ls -l "$OUT"

      # ============ 第二遍：只改 DTS，复用已编译的工具链/软件包 ============
      - name: Rebuild Firmware (490M)
        run: |
          cd $OPENWRT_PATH
          # 复用 DIY 函数库的分区替换逻辑（幂等：已是目标分区则跳过）
          source "$GITHUB_WORKSPACE/$DIY_LIB"
          n60pro_patch_ubi "$UBI_490M" "$UBI_506M" "$DTS_PATH"
          echo "==================== DTS 已切换为 490M ===================="

          # 只删与 dtb / 设备 kernel 相关的产物，强制重新生成（vmlinux、软件包全部复用）。
          # 用 -print 计数：find -delete 没匹配到也返回 0，一旦文件名漂移就会静默留下旧产物，
          # 导致后面把一个改名的 506M 镜像当 490M 发出去，所以这里必须硬断言。
          [ -d build_dir ] || { echo "ERROR: build_dir 不存在，第一遍编译没有产物"; exit 1; }
          removed=$(find build_dir -type f \
            \( -name "image-*n60-pro.dtb" \
               -o -name "$KERNEL_BIN" \
               -o -path "*/mediatek/$(basename "$DTS_PATH")" \) \
            -print -delete | wc -l | tr -d ' ')
          echo "已删除过期产物: $removed 个"
          [ "$removed" -ge 2 ] || {
            echo "ERROR: 过期产物没删到（期望 dtb + kernel.bin），文件名可能已变更，拒绝发布未重编的镜像"
            find build_dir -name "*n60-pro*" | head -20
            exit 1
          }

          # 只重编内核（含 dtb）再重打镜像，不跑全量 make：
          #   target/linux/compile -> 重建 dtb + kernel
          #   target/install        -> 重新执行镜像打包（fit / sysupgrade.itb），rootfs 与软件包全部复用
          echo "==================== 只重建 kernel + 镜像 ===================="
          make -j$(nproc) target/linux/compile || make -j1 target/linux/compile V=s
          make -j$(nproc) target/install || make -j1 target/install V=s

      - name: Verify DTB Partition (490M)
        env:
          EXPECT_UBI_OFFSET: '0x0580000'
          EXPECT_UBI_SIZE: '0x1ea00000'
        run: |
          cd $OPENWRT_PATH
          DTB=$(find build_dir -name "$DTB_NAME" 2>/dev/null | head -1) || true
          [ -n "$DTB" ] || { echo "ERROR: 未找到编译产出的 dtb"; exit 1; }
          DTS=$(dtc -I dtb -O dts "$DTB")
          printf '%s\n' "$DTS" | grep -A3 'label = "ubi"'
          REG=$(printf '%s\n' "$DTS" | grep -A3 'label = "ubi"' \
                | sed -n 's/.*reg = <\([^>]*\)>.*/\1/p' | head -1)
          [ -n "$REG" ] || { echo "ERROR: 无法从 dtb 中解析出 ubi 的 reg（节点结构可能变了）"; exit 1; }
          set -- $REG
          [ $# -ge 2 ] || { echo "ERROR: ubi reg 格式异常: <$REG>"; exit 1; }
          OFF=$(( $1 )); SIZE=$(( $2 ))
          EXP_OFF=$(( $EXPECT_UBI_OFFSET )); EXP_SIZE=$(( $EXPECT_UBI_SIZE ))
          echo "ubi offset=$OFF ($(printf '0x%x' "$OFF")), size=$SIZE ($(printf '0x%x' "$SIZE"))"
          echo "expect offset=$EXP_OFF ($EXPECT_UBI_OFFSET), size=$EXP_SIZE ($EXPECT_UBI_SIZE)"
          [ "$OFF"  -eq "$EXP_OFF"  ] || { echo "ERROR: ubi offset 不是 $EXPECT_UBI_OFFSET（实际 $(printf '0x%x' "$OFF")）"; exit 1; }
          [ "$SIZE" -eq "$EXP_SIZE" ] || { echo "ERROR: ubi size 不是 $EXPECT_UBI_SIZE（实际 $(printf '0x%x' "$SIZE")）"; exit 1; }
          echo "OK: ubi = <$EXPECT_UBI_OFFSET $EXPECT_UBI_SIZE>"
          # 与第一遍的 dtb 指纹对比，确保 dtb 真的重新生成了
          DTB_SHA_490M=$(sha256sum "$DTB" | cut -d' ' -f1)
          echo "dtb 506M: ${DTB_SHA_506M:-unknown}"
          echo "dtb 490M: ${DTB_SHA_490M}"
          [ "$DTB_SHA_490M" != "${DTB_SHA_506M:-}" ] \
            || { echo "ERROR: dtb 与第一遍完全相同，第二次 make 没有重新生成 dtb"; exit 1; }

      - name: Collect Firmware (490M)
        env:
          SIZE: 490m
        run: |
          cd $OPENWRT_PATH
          OUT=$GITHUB_WORKSPACE/fw/$SIZE
          rm -rf "$OUT"; mkdir -p "$OUT"
          shopt -s nullglob
          n=0
          for f in bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET/$DEVICE_GLOB; do
            base=$(basename "$f"); stem="${base%.*}"; ext="${base##*.}"
            cp -f "$f" "$OUT/${stem}-${SIZE}.${ext}"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "ERROR: 未收集到固件"; ls -l bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET || true; exit 1; }
          cp -f .config "$OUT/build-${SIZE}.config" || true
          ( cd "$OUT" && sha256sum * > "sha256sums-${SIZE}.txt" )
          ls -l "$OUT"

      # 上传前最后一道关：两个变体的最终镜像必须真的不同
      - name: Verify Variants Differ
        run: |
          # 本设备产物是 .itb（IMAGES := sysupgrade.itb），不能写死 .bin 扩展名
          IMG506=$(ls $GITHUB_WORKSPACE/fw/506m/*sysupgrade* 2>/dev/null | head -1) || true
          IMG490=$(ls $GITHUB_WORKSPACE/fw/490m/*sysupgrade* 2>/dev/null | head -1) || true
          [ -n "$IMG506" ] && [ -n "$IMG490" ] || { echo "ERROR: fw 目录里没找到 sysupgrade 镜像"; ls -lR $GITHUB_WORKSPACE/fw; exit 1; }
          H506=$(sha256sum "$IMG506" | cut -d' ' -f1)
          H490=$(sha256sum "$IMG490" | cut -d' ' -f1)
          echo "506M: $(basename "$IMG506") ($(stat -c %s "$IMG506") bytes) $H506"
          echo "490M: $(basename "$IMG490") ($(stat -c %s "$IMG490") bytes) $H490"
          # 分区不同 → 内容必然不同；相同说明第二遍没生效，发出去就是个改了名的 506M
          [ "$H506" != "$H490" ] \
            || { echo "ERROR: 490M 与 506M 镜像内容完全相同，第二次编译没有产出新镜像"; exit 1; }

      - name: Upload Firmware To Release (506M)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_506M }}
          name: ImmortalWrt N60 Pro 506.5MB
          body: |
            Netcore N60 Pro / MT7986A / 2GB DDR4 / 512MB SPI NAND
            分区布局：spi-nand-512MB-ubi-506.5MB（ubi ${{ env.UBI_506M }}）

            预装：momo（含中文 LuCI）、easytier（含中文 LuCI）、sing-box
            默认地址：192.168.12.1  默认用户：root  默认密码：password
            源码：immortalwrt master @ ${{ env.SOURCE_COMMIT }}（${{ env.SOURCE_DATE }}）
          artifacts: fw/506m/*
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Firmware To Release (490M)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_490M }}
          name: ImmortalWrt N60 Pro 490MB
          body: |
            Netcore N60 Pro / MT7986A / 2GB DDR4 / 512MB SPI NAND
            分区布局：spi-nand-512MB-ubi-490MB（ubi ${{ env.UBI_490M }}）

            预装：momo（含中文 LuCI）、easytier（含中文 LuCI）、sing-box
            默认地址：192.168.12.1  默认用户：root  默认密码：password
            源码：immortalwrt master @ ${{ env.SOURCE_COMMIT }}（${{ env.SOURCE_DATE }}）
          artifacts: fw/490m/*
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Summary
        run: |
          for d in fw/506m fw/490m; do
            echo "===== $d ====="
            ls -l "$d" || true
          done
          # 两次产物必须都存在，避免“编译成功但固件缺失”
          [ -n "$(ls -A fw/506m)" ] && [ -n "$(ls -A fw/490m)" ]
          df -hT
