name: netcore-n60pro-imagebuilder-506m

# ===========================================================================
#  Netcore N60 Pro（MT7986A / 512MB SPI NAND）｜ OpenWrt 官方 ImageBuilder
# ---------------------------------------------------------------------------
#  构建源：只用官方（downloads.openwrt.org）
#    - 默认 snapshot（内核最新）
#    - 要固定 ABI / 可复现就填 openwrt_version=25.12.6
#
#  预装软件（开关优先级：dispatch 输入 > 仓库变量 > 默认值）
#    ENABLE_MOMO=false      momo + luci-app-momo + sing-box（momo 依赖 sing-box，绑一起；默认不装）
#    ENABLE_EASYTIER=true   EasyTier（noweb）+ luci-app-easytier + 中文
#    ENABLE_MEOW=true       meow-rs（Rust 版 mihomo，需 .apk 体系）+ luci-app-meow
#
#  sing-box 不用 feed 版本：始终取 SagerNet/sing-box 最新 release 的 linux-arm64-musl 构建
#  （OpenWrt 是 musl libc，glibc 动态链接版跑不起来；没有 -musl 资产时退回通用版并做 ELF 检查），
#  覆盖 /usr/bin/sing-box（momo / EasyTier / meow 同样都取各自上游 latest，无需指定版本）
#  momo 走自建签名 feed，公钥预置在 /etc/apk/keys/momo.pem，刷机后 apk 直接可用
#
#  分区：只做 506.5MiB 一种 —— 改 build_dir 里 dtb 的 ubi 分区后重打 FIT
#  刷机：506M -> 506M 直接 sysupgrade；128M 原厂跨过来必须先刷目标分区表的 recovery
# ===========================================================================

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'snapshot 跟主线 / 25.12.6 用正式版'
        required: false
        default: 'snapshot'
      lan_ip:
        description: '默认 LAN IP'
        required: false
        default: '192.168.12.1'
      enable_momo:
        description: 'momo + sing-box（默认不装）；留空=仓库变量 ENABLE_MOMO 或默认 false'
        required: false
        default: ''
      enable_easytier:
        description: 'EasyTier；留空=仓库变量 ENABLE_EASYTIER 或默认 true'
        required: false
        default: ''
      enable_meow:
        description: 'meow-rs；留空=仓库变量 ENABLE_MEOW 或默认 true'
        required: false
        default: ''
  # 点 star 触发（只在默认分支生效）
  watch:
    types: [started]
  # 定时触发（cron 只有 UTC）：每周日 03:00 UTC = 北京 11:00
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # ---- 设备 ----
  PROFILE: netcore_n60-pro
  PKG_ARCH: aarch64_cortex-a53
  DEVICE_NAME: netcore-n60-pro
  TAG: netcore-n60pro-ib-506m
  # 512MB NAND：ubi 起始 0x0580000 + 506.5MiB = 0x20000000
  UBI_506M: 0x0580000 0x1fa80000

  # ---- 构建源 ----
  OPENWRT_VER: ${{ github.event.inputs.openwrt_version || 'snapshot' }}
  LAN_IP: ${{ github.event.inputs.lan_ip || '192.168.12.1' }}

  # ---- 软件开关（dispatch 输入 > 仓库变量 > 默认值）----
  ENABLE_MOMO: ${{ github.event.inputs.enable_momo || vars.ENABLE_MOMO || 'false' }}
  ENABLE_EASYTIER: ${{ github.event.inputs.enable_easytier || vars.ENABLE_EASYTIER || 'true' }}
  ENABLE_MEOW: ${{ github.event.inputs.enable_meow || vars.ENABLE_MEOW || 'true' }}

  # ---- 版本：三个软件都直接取上游 latest，不需要指定 ----

  # ---- momo 签名 apk feed ----
  MOMO_FEED_BASE: https://momomomo.pages.dev

  # ---- 包列表 ----
  # LuCI 框架 + 模块 + 主题 + web 服务（只装 luci-compat 是没有页面的）
  # PPPoE：ppp + ppp-mod-pppoe（用户态）、kmod-ppp/pppoe/pppox（内核）、luci-proto-ppp（界面）
  # IPv6：odhcp6c（WAN 侧 PD）+ odhcpd-ipv6only（LAN 侧 RA/DHCPv6）+ luci-proto-ipv6
  # 透明代理要 kmod-nft-socket / kmod-nft-tproxy，TUN 监听要 kmod-tun
  PKGS_BASE: luci luci-base luci-mod-network luci-mod-system luci-mod-status luci-theme-bootstrap uhttpd uhttpd-mod-ubus rpcd rpcd-mod-luci rpcd-mod-file rpcd-mod-rrdns luci-compat luci-lua-runtime luci-lib-base luci-lib-ip luci-lib-jsonc luci-lib-nixio libubus-lua libuci-lua luci-i18n-base-zh-cn bash ca-bundle curl firewall4 ip-full kmod-tun kmod-dummy kmod-mtd-rw kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-nft-fib kmod-inet-diag kmod-netlink-diag miniupnpd-nftables luci-app-upnp luci-i18n-upnp-zh-cn
  PKGS_PPPOE: ppp ppp-mod-pppoe kmod-ppp kmod-pppoe kmod-pppox luci-proto-ppp
  PKGS_IPV6: odhcp6c odhcpd-ipv6only luci-proto-ipv6

jobs:
  build:
    name: N60 Pro 506.5MB ImageBuilder
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # workflow_dispatch 随时可跑；star 触发默认不限人（配仓库变量 STAR_ACTOR 可收紧）；
    # schedule 必须显式放行，否则配了 STAR_ACTOR 后定时任务会被静默 skip
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      vars.STAR_ACTOR == '' ||
      github.actor == vars.STAR_ACTOR

    steps:
      # =====================================================================
      #  准备
      # =====================================================================
      - name: '[setup] 安装构建依赖'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install --no-install-recommends \
            zstd unzip jq device-tree-compiler u-boot-tools squashfs-tools \
            python3 curl gcc libc6-dev binutils file

      - name: '[setup] 下载 ImageBuilder'
        run: |
          set -euo pipefail
          # 正式版文件名带版本号，snapshot 不带；按顺序探一遍，换版本时不用手改
          case "$OPENWRT_VER" in
            snapshot|SNAPSHOT|snapshots)
              BASE_URL=https://downloads.openwrt.org/snapshots
              DISTRIB=OPENWRT-SNAPSHOT
              CANDIDATES="openwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst"
              ;;
            *)
              BASE_URL=https://downloads.openwrt.org/releases/${OPENWRT_VER}
              DISTRIB=OPENWRT-${OPENWRT_VER}
              CANDIDATES="openwrt-imagebuilder-${OPENWRT_VER}-mediatek-filogic.Linux-x86_64.tar.zst openwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst"
              ;;
          esac

          IB_FILE=""
          for NAME in $CANDIDATES; do
            if curl -fsIL --retry 2 --max-time 30 "${BASE_URL}/targets/mediatek/filogic/${NAME}" > /dev/null; then
              IB_FILE=$NAME
              break
            fi
          done
          [ -n "$IB_FILE" ] || { echo "ERROR: 在 $BASE_URL 找不到 $DISTRIB 的 ImageBuilder"; exit 1; }

          IB_URL="${BASE_URL}/targets/mediatek/filogic/${IB_FILE}"
          echo "source = $DISTRIB"
          echo "IB_URL = $IB_URL"

          curl -fL --retry 3 --retry-delay 5 -o ib.tar.zst "$IB_URL"
          tar --zstd -xf ib.tar.zst
          IB=$(ls -d "$PWD"/*imagebuilder-* | head -1)
          [ -d "$IB" ] || { echo "ERROR: 解压后没找到 ImageBuilder 目录"; ls -al; exit 1; }

          # 本流程按 apk 体系（25.12+/snapshot）走，opkg 时代的不支持
          [ -f "$IB/repositories" ] || { echo "ERROR: 这个 ImageBuilder 是 opkg 体系，请用 25.12.x 或 snapshot"; exit 1; }

          BUILDINFO=$(curl -fsSL --retry 3 "${BASE_URL}/targets/mediatek/filogic/version.buildinfo" | head -1 | tr -d '\r\n' || true)
          {
            echo "IB_DIR=$IB"
            echo "OPENWRT_DISTRIB=$DISTRIB"
            echo "OPENWRT_BUILD=${BUILDINFO:-$DISTRIB}"
          } >> "$GITHUB_ENV"
          echo "ImageBuilder = $IB (${BUILDINFO:-$DISTRIB})"

      # =====================================================================
      #  FILES overlay 基础（LAN IP / 中文界面）
      # =====================================================================
      - name: '[files] 基础配置 overlay'
        run: |
          set -euo pipefail
          rm -rf files
          mkdir -p files/usr/bin files/etc/uci-defaults

          # uci-defaults 在 network 服务启动前执行，直接生效
          printf '%s\n' \
            '#!/bin/sh' \
            "uci -q set network.lan.ipaddr='${LAN_IP}'" \
            "uci -q set network.lan.netmask='255.255.255.0'" \
            'uci -q commit network' \
            'exit 0' \
            > files/etc/uci-defaults/98-n60pro-lan

          printf '%s\n' \
            '#!/bin/sh' \
            "uci -q set luci.main.lang='zh_cn'" \
            'uci -q commit luci' \
            'exit 0' \
            > files/etc/uci-defaults/99-n60pro-lang

          chmod 0755 files/etc/uci-defaults/*
          echo "LAN IP = $LAN_IP"

      # =====================================================================
      #  momo（含 luci-app-momo）
      # =====================================================================
      - name: '[momo] 接入 apk feed'
        if: env.ENABLE_MOMO == 'true'
        run: |
          set -euo pipefail
          cd "$IB_DIR"

          # momo feed 只提供这三个分支；正式版 25.12.x 走 openwrt-25.12
          case "$OPENWRT_VER" in
            snapshot|SNAPSHOT|snapshots) BRANCH=SNAPSHOT ;;
            24.10*)                      BRANCH=openwrt-24.10 ;;
            *)                           BRANCH=openwrt-25.12 ;;
          esac
          FEED="${MOMO_FEED_BASE}/${BRANCH}/${PKG_ARCH}/momo"
          echo "momo feed = $FEED"

          # packages.adb 是压缩 ADB，没法 grep 包名；feed 另外提供 index.json
          curl -fsI --retry 2 "${FEED}/packages.adb" > /dev/null \
            || { echo "ERROR: ${FEED}/packages.adb 不存在（分支/架构不对？）"; exit 1; }
          curl -fsSL --retry 3 -o momo.index.json "${FEED}/index.json" \
            || { echo "ERROR: 取不到 ${FEED}/index.json"; exit 1; }
          for P in momo luci-app-momo; do
            jq -e --arg p "$P" '.packages[$p]' momo.index.json > /dev/null \
              || { echo "ERROR: momo feed 里没有包 $P"; jq -r '.packages | keys[]' momo.index.json; exit 1; }
          done

          MOMO_PKGS="momo luci-app-momo"
          if jq -e '.packages["luci-i18n-momo-zh-cn"]' momo.index.json > /dev/null; then
            MOMO_PKGS="$MOMO_PKGS luci-i18n-momo-zh-cn"
          else
            echo "WARN momo feed 里没有 luci-i18n-momo-zh-cn，界面只有英文"
          fi
          {
            echo "MOMO_PKGS=$MOMO_PKGS"
            echo "MOMO_BRANCH=$BRANCH"
          } >> "$GITHUB_ENV"

          # 构建期：源写进 repositories，公钥放 keys/（组装时会被装到 /etc/apk/keys/）
          grep -qF "$FEED/packages.adb" repositories || echo "$FEED/packages.adb" >> repositories
          curl -fsSL --retry 3 -o public-key.pem "${MOMO_FEED_BASE}/public-key.pem"
          mkdir -p keys
          cp -f public-key.pem keys/momo.pem

          # 刷机后：公钥 + 源也放进固件，apk update / 装语言包不用再跑 feed.sh
          # 注意这里已经 cd 到 IB 目录，FILES 必须用 GITHUB_WORKSPACE 的绝对路径
          mkdir -p "$GITHUB_WORKSPACE/files/etc/apk/keys" "$GITHUB_WORKSPACE/files/etc/apk/repositories.d"
          cp -f public-key.pem "$GITHUB_WORKSPACE/files/etc/apk/keys/momo.pem"
          echo "$FEED/packages.adb" > "$GITHUB_WORKSPACE/files/etc/apk/repositories.d/momo.list"

          # 万一这个 IB 不认 keys/，用 --allow-untrusted 兜底
          sed -i 's|[$](APK) add --arch|$(APK) add --allow-untrusted --arch|' Makefile
          grep -q "allow-untrusted" Makefile || echo "WARN Makefile 里没匹配到 apk add --arch"

      - name: '[momo] 换上游 sing-box 二进制（musl）'
        if: env.ENABLE_MOMO == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 始终取上游 latest；顺带拿到资产清单，文件名按实际 release 挑，不靠猜
          REL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                 https://api.github.com/repos/SagerNet/sing-box/releases/latest)
          TAG=$(printf '%s' "$REL" | jq -r '.tag_name')
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "ERROR: 取 sing-box 版本失败"; exit 1; }
          VER="${TAG#v}"
          echo "sing-box = $TAG"

          # 本机是 OpenWrt（musl libc）：必须用 -musl 构建，glibc 动态链接版刷进去直接跑不起来
          # 老 release 没有 -musl 时退回通用版，由下面的 ELF 解释器检查兜底
          ASSETS=$(printf '%s' "$REL" | jq -r '.assets[].name')
          SB_ASSET=$(printf '%s\n' "$ASSETS" | grep -Ex "sing-box-${VER}-linux-arm64-musl\.tar\.gz" | head -1 || true)
          if [ -z "$SB_ASSET" ]; then
            SB_ASSET=$(printf '%s\n' "$ASSETS" | grep -Ex "sing-box-${VER}-linux-arm64\.tar\.gz" | head -1 || true)
            [ -n "$SB_ASSET" ] && echo "WARN 上游没有 ${VER} 的 linux-arm64-musl，退回 $SB_ASSET"
          fi
          [ -n "$SB_ASSET" ] || {
            echo "ERROR: release 里没有 linux-arm64 资产，现有 arm64 资产："
            printf '%s\n' "$ASSETS" | grep arm64 || true
            exit 1
          }
          echo "asset = $SB_ASSET"

          URL="https://github.com/SagerNet/sing-box/releases/download/${TAG}/${SB_ASSET}"
          mkdir -p sb
          curl -fL --retry 3 --retry-delay 5 -o sb/sing-box.tar.gz "$URL" \
            || { echo "ERROR: 下载失败 $URL"; exit 1; }

          tar -xzf sb/sing-box.tar.gz -C sb
          SB=$(find sb -type f -name sing-box | head -1)
          [ -n "$SB" ] || { echo "ERROR: 压缩包里没有 sing-box 二进制"; exit 1; }
          file -b "$SB" | grep -q aarch64 || { echo "ERROR: 不是 aarch64 二进制"; file "$SB"; exit 1; }
          # 兜死：动态链接且解释器是 glibc 的一律拒收（musl 版是 /lib/ld-musl-aarch64.so.1 或静态）
          if file -b "$SB" | grep -qi 'ld-linux'; then
            echo "ERROR: 这是 glibc 动态链接的二进制，OpenWrt(musl) 上跑不起来：$SB_ASSET"
            file "$SB"
            exit 1
          fi

          # FILES 在包安装之后铺进 rootfs，所以这份一定盖掉 feed 里的旧版本
          install -m 0755 "$SB" files/usr/bin/sing-box
          {
            echo "SINGBOX_TAG=$TAG"
            echo "SINGBOX_ASSET=$SB_ASSET"
            echo "SINGBOX_SHA=$(sha256sum files/usr/bin/sing-box | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      # =====================================================================
      #  meow（可选）
      # =====================================================================
      - name: '[meow] 取 apk 并建本地索引'
        if: env.ENABLE_MEOW == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$IB_DIR"
          mkdir -p packages

          # 始终取上游 latest
          TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                 https://api.github.com/repos/meow-rs/meow-rs/releases/latest | jq -r '.tag_name')
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "ERROR: 取 meow 版本失败"; exit 1; }
          echo "meow = $TAG"

          # 按资产名匹配，避开 .ipk / .sha256 / x86_64
          ASSETS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/meow-rs/meow-rs/releases/tags/${TAG}" \
                   | jq -r '.assets[].browser_download_url')
          MEOW_APK=$(printf '%s\n' "$ASSETS" | grep -E "/meow_[^/]*_${PKG_ARCH}\.apk$" | head -1)
          LUCI_APK=$(printf '%s\n' "$ASSETS" | grep -E "/luci-app-meow_[^/]*_all\.apk$" | head -1)
          [ -n "$MEOW_APK" ] || { echo "ERROR: release 里没有 meow 的 ${PKG_ARCH} apk"; printf '%s\n' "$ASSETS"; exit 1; }
          [ -n "$LUCI_APK" ] || { echo "ERROR: release 里没有 luci-app-meow 的 apk"; printf '%s\n' "$ASSETS"; exit 1; }

          # 必须放在 packages/ 顶层：IB 的 package_index 只 glob packages/*.apk
          curl -fL --retry 3 -o "packages/$(basename "$MEOW_APK")" "$MEOW_APK"
          curl -fL --retry 3 -o "packages/$(basename "$LUCI_APK")" "$LUCI_APK"

          # apk 按 <name>-<version>.apk 找包，上游却是 <name>_<ver>_<arch>.apk，不改名会报
          #   ERROR: meow-x.y.z-r1: package mentioned in index not found
          rename_apk() {  # $1=文件名 $2=架构后缀
            f="$1"; a="$2"
            case "$f" in
              *_*_"${a}".apk)
                n="${f%%_*}"; v="${f#*_}"; v="${v%_"${a}".apk}"
                mv -f "packages/$f" "packages/${n}-${v}.apk"
                echo "renamed: $f -> ${n}-${v}.apk"
                ;;
              *) echo "keep: $f" ;;
            esac
          }
          rename_apk "$(basename "$MEOW_APK")" "$PKG_ARCH"
          rename_apk "$(basename "$LUCI_APK")" "all"

          # 包未签名 → apk add 补 --allow-untrusted
          sed -i 's|[$](APK) add --arch|$(APK) add --allow-untrusted --arch|' Makefile
          grep -q "allow-untrusted" Makefile || echo "WARN Makefile 里没匹配到 apk add --arch"

          ls -lh packages/
          echo "MEOW_TAG=$TAG" >> "$GITHUB_ENV"

      # =====================================================================
      #  EasyTier（noweb + LuCI + 中文）
      # =====================================================================
      - name: '[easytier] 安装二进制 + LuCI + 中文'
        if: env.ENABLE_EASYTIER == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 始终取上游 latest
          TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                 https://api.github.com/repos/EasyTier/EasyTier/releases/latest | jq -r '.tag_name')
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "ERROR: 取 EasyTier 版本失败"; exit 1; }
          echo "EasyTier = $TAG"

          mkdir -p pkgs/et
          curl -fL --retry 3 -o pkgs/easytier.zip \
            "https://github.com/EasyTier/EasyTier/releases/download/${TAG}/easytier-linux-aarch64-${TAG}.zip"
          unzip -o -j pkgs/easytier.zip -d pkgs/et > /dev/null

          # noweb 形态：只装 core + cli，不带 easytier-web（那个会额外开 8080 端口）
          for B in easytier-core easytier-cli; do
            [ -f "pkgs/et/$B" ] || { echo "ERROR: zip 里没有 $B"; exit 1; }
            install -m 0755 "pkgs/et/$B" "files/usr/bin/$B"
          done

          # LuCI：luasrc -> /usr/lib/lua/luci，root -> /
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git et-src
          mkdir -p files/usr/lib/lua/luci
          cp -a et-src/luci-app-easytier/luasrc/. files/usr/lib/lua/luci/
          cp -a et-src/luci-app-easytier/root/. files/
          chmod -R 0755 files/etc/init.d 2>/dev/null || true

          # 中文 lmo：po2lmo 必须走上游 Makefile（否则 undefined reference to sfh_hash）
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openwrt/luci.git luci-src
          git -C luci-src sparse-checkout set modules/luci-base/src
          make -C luci-src/modules/luci-base/src po2lmo
          mkdir -p files/usr/lib/lua/luci/i18n
          luci-src/modules/luci-base/src/po2lmo \
            et-src/luci-app-easytier/po/zh_Hans/easytier.po \
            files/usr/lib/lua/luci/i18n/easytier.zh-cn.lmo
          [ -s files/usr/lib/lua/luci/i18n/easytier.zh-cn.lmo ] \
            || { echo "ERROR: easytier 中文 lmo 生成失败"; exit 1; }

          echo "EASYTIER_TAG=$TAG" >> "$GITHUB_ENV"

      # =====================================================================
      #  构建
      # =====================================================================
      # 不手工拆 FIT：把改好的 dtb 放回 build_dir，让 ImageBuilder 自己重打，
      # hash / load 地址 / 压缩 / metadata 全由官方规则处理。
      # 第一次 make image 只为拿到 build_dir 里的 dtb，128M 的原镜像直接丢弃。
      - name: '[build] 打 506M 镜像（改 dtb 后重打 FIT）'
        run: |
          set -euo pipefail
          cd "$IB_DIR"
          mkdir -p packages

          # ImageBuilder 的顺序是「先 apk add 装包，最后 prepare_rootfs 铺 FILES」
          # （include/image.mk: target-dir-% -> include/rootfs.mk: prepare_rootfs 第一行 file_copy）
          # 所以这里先确认 FILES 里那份 sing-box 还在、且就是刚下载的版本，
          # 否则 build 出来会静默变回 feed 里的旧版本
          if [ "${ENABLE_MOMO:-false}" = "true" ]; then
            [ -f "$GITHUB_WORKSPACE/files/usr/bin/sing-box" ] \
              || { echo "ERROR: FILES 里没有 sing-box 二进制"; exit 1; }
            [ "$(sha256sum "$GITHUB_WORKSPACE/files/usr/bin/sing-box" | cut -d' ' -f1)" = "$SINGBOX_SHA" ] \
              || { echo "ERROR: FILES 里的 sing-box 与下载的不一致"; exit 1; }
            echo "  OK  FILES/sing-box = $SINGBOX_TAG"
          fi

          PACKAGES="$PKGS_BASE $PKGS_PPPOE $PKGS_IPV6"
          # momo 与 sing-box 绑定安装
          if [ "${ENABLE_MOMO:-false}" = "true" ]; then
            PACKAGES="$PACKAGES $MOMO_PKGS sing-box"
          fi
          if [ "${ENABLE_MEOW:-false}" = "true" ]; then
            PACKAGES="$PACKAGES meow luci-app-meow"
          fi
          echo "PACKAGES=$PACKAGES"

          # 只跑一次，不重试：失败就把原因和人话建议打出来
          build_image() {
            if make image PROFILE="$PROFILE" FILES="$GITHUB_WORKSPACE/files" PACKAGES="$PACKAGES" > build.log 2>&1; then
              return 0
            fi
            tail -40 build.log
            echo "---------- 缺失的包 ----------"
            { grep -oE "Unknown package '[^']+'" build.log | sed -E "s/.*'(.*)'/\1/" || true
              grep -oE "[A-Za-z0-9._+-]+ \(no such package\)" build.log | sed 's/ (no such package)//' || true
            } | sort -u | sed 's/^/  缺: /'
            echo "----------------------------------------"
            echo "  - 缺 libubox20xxxxxx / libblobmsg-json20xxxxxx：上游 feed 正在重建，过几小时重跑，或 openwrt_version 填 25.12.6"
            echo "  - 报 'package mentioned in index not found'：packages/ 里的 .apk 必须是 <name>-<version>.apk"
            return 1
          }

          echo "=== 第 1 次 make image：拿 build_dir 里的 dtb ==="
          build_image

          DTB=$(find build_dir -name "image-mt7986a-netcore-n60-pro.dtb" | head -1)
          [ -n "$DTB" ] || { echo "ERROR: build_dir 里找不到 dtb"; find build_dir -name "*.dtb" | head; exit 1; }

          cp -f "$DTB" dtb.orig
          dtc -I dtb -O dts dtb.orig -o dtb.orig.dts

          set -- $UBI_506M
          OFF="$1"; SIZE="$2"

          # 按 ubi 起始地址 0x580000 定位那行 reg 直接替换（不依赖 label/reg 先后顺序）
          sed -E "s/reg = <0x0*580000 0x[0-9a-fA-F]+>;/reg = <${OFF} ${SIZE}>;/" dtb.orig.dts > patched.dts
          if cmp -s dtb.orig.dts patched.dts; then
            echo "ERROR: 没替换到 ubi 的 reg（dts 里找不到 0x580000 起始的分区行）"
            grep -A3 'label = "ubi"' dtb.orig.dts || true
            exit 1
          fi
          dtc -q -I dts -O dtb -o dtb-506m.dtb patched.dts

          # 断言：dtc 反编译会去掉前导 0（0x0580000 -> 0x580000），所以按数值比较
          REG=$(dtc -I dtb -O dts dtb-506m.dtb | grep -A3 'label = "ubi"' | sed -n 's/.*reg = <\([^>]*\)>;.*/\1/p' | head -1)
          echo "ubi reg = <$REG>"
          set -- $REG
          [ $# -ge 2 ] || { echo "ERROR: 解析 dtb 里的 ubi reg 失败"; exit 1; }
          [ "$(( $1 ))" -eq "$(( OFF ))" ] && [ "$(( $2 ))" -eq "$(( SIZE ))" ] \
            || { echo "ERROR: dtb 分区不对，期望 <$OFF $SIZE> 实际 <$REG>"; exit 1; }

          echo "=== 第 2 次 make image：用改好的 dtb 重打 FIT ==="
          cp -f dtb-506m.dtb "$DTB"
          rm -f bin/targets/mediatek/filogic/*sysupgrade.itb
          build_image

          NEW=$(ls bin/targets/mediatek/filogic/*squashfs-sysupgrade.itb 2>/dev/null | head -1 || true)
          [ -n "$NEW" ] || { echo "ERROR: 没有产出 sysupgrade.itb"; ls -l bin/targets/mediatek/filogic; exit 1; }
          cp -f "$NEW" itb-506m.itb
          ls -lh itb-506m.itb

      # =====================================================================
      #  校验
      # =====================================================================
      - name: '[verify] 校验 rootfs 与 FIT'
        run: |
          set -euo pipefail
          cd "$IB_DIR"

          TARGET=$(find build_dir -maxdepth 3 -type d -name "root-*" | head -1)
          [ -n "$TARGET" ] || { echo "ERROR: 找不到 TARGET_DIR"; exit 1; }
          need() { [ -e "$TARGET$1" ] || { echo "ERROR: rootfs 缺少 $1"; exit 1; }; echo "  OK  $1"; }

          # ---- 透明代理 ----
          if [ "${ENABLE_MOMO:-false}" = "true" ]; then
            [ -f "$TARGET/usr/bin/sing-box" ] || { echo "ERROR: rootfs 里没有 /usr/bin/sing-box"; exit 1; }
            file -b "$TARGET/usr/bin/sing-box" | grep -q aarch64 \
              || { echo "ERROR: /usr/bin/sing-box 不是 aarch64"; exit 1; }
            if file -b "$TARGET/usr/bin/sing-box" | grep -qi 'ld-linux'; then
              echo "ERROR: /usr/bin/sing-box 是 glibc 动态链接版，OpenWrt(musl) 跑不起来"; exit 1
            fi
            [ "$(sha256sum "$TARGET/usr/bin/sing-box" | cut -d' ' -f1)" = "$SINGBOX_SHA" ] \
              || { echo "ERROR: sing-box 不是上游 $SINGBOX_TAG 那份"; exit 1; }
            echo "  OK  sing-box $SINGBOX_TAG（${SINGBOX_ASSET:-上游二进制} 已覆盖）"

            MOMO_MENU=""
            for M in /usr/share/luci/menu.d/luci-app-momo.json \
                     /usr/share/luci/menu.d/momo.json \
                     /usr/lib/lua/luci/controller/momo.lua; do
              if [ -e "$TARGET$M" ]; then MOMO_MENU=$M; break; fi
            done
            [ -n "$MOMO_MENU" ] || { echo "ERROR: 没找到 luci-app-momo 的菜单文件"; exit 1; }
            echo "  OK  LuCI 菜单 -> $MOMO_MENU"
            need /etc/apk/keys/momo.pem
          else
            if [ -e "$TARGET/usr/bin/sing-box" ]; then
              echo "ERROR: 没开 ENABLE_MOMO，rootfs 里却有 sing-box"; exit 1
            fi
            echo "  OK  未安装 momo / sing-box（ENABLE_MOMO=false）"
          fi

          # ---- meow（可选）----
          if [ "${ENABLE_MEOW:-false}" = "true" ]; then
            need /usr/bin/meow
            file -b "$TARGET/usr/bin/meow" | grep -q aarch64 \
              || { echo "ERROR: /usr/bin/meow 不是 aarch64"; exit 1; }
            for F in /etc/init.d/meow /etc/config/meow /etc/meow/config.yaml; do need "$F"; done
          else
            if [ -e "$TARGET/usr/bin/meow" ]; then
              echo "ERROR: 没开 ENABLE_MEOW，rootfs 里却有 meow"; exit 1
            fi
            echo "  OK  未安装 meow（ENABLE_MEOW=false）"
          fi

          # ---- EasyTier（可选）----
          if [ "${ENABLE_EASYTIER:-false}" = "true" ]; then
            for F in /usr/bin/easytier-core /usr/bin/easytier-cli \
                     /usr/lib/lua/luci/controller/easytier.lua; do need "$F"; done
            [ -s "$TARGET/usr/lib/lua/luci/i18n/easytier.zh-cn.lmo" ] \
              || echo "  WARN 缺 easytier 中文 lmo（只影响翻译）"
            if [ -e "$TARGET/usr/bin/easytier-web" ]; then
              echo "ERROR: 出现 easytier-web，应为 noweb 形态"; exit 1
            fi
            echo "  OK  easytier noweb 形态"
          else
            if [ -e "$TARGET/usr/bin/easytier-core" ]; then
              echo "ERROR: 没开 ENABLE_EASYTIER，rootfs 里却有 easytier"; exit 1
            fi
            echo "  OK  未安装 EasyTier（ENABLE_EASYTIER=false）"
          fi

          # ---- LuCI / 拨号 / IPv6 ----
          RPCD=""
          for C in /sbin/rpcd /usr/sbin/rpcd; do
            if [ -x "$TARGET$C" ]; then RPCD="$C"; break; fi
          done
          [ -n "$RPCD" ] || { echo "ERROR: rootfs 里没有 rpcd"; exit 1; }
          echo "  OK  $RPCD"

          for F in /usr/sbin/uhttpd /www/luci-static/bootstrap/cascade.css \
                   /usr/sbin/pppd /usr/sbin/odhcp6c /usr/sbin/odhcpd; do need "$F"; done

          PPPOE_SO=$(ls "$TARGET"/usr/lib/pppd/*/pppoe.so 2>/dev/null | head -1)
          [ -n "$PPPOE_SO" ] || { echo "ERROR: 缺 pppd 的 pppoe.so，PPPoE 不可用"; exit 1; }
          echo "  OK  ${PPPOE_SO#$TARGET}"

          check_any() {
            DESC="$1"; shift
            for p in "$@"; do
              if [ -e "$TARGET$p" ]; then echo "  OK  $DESC -> $p"; return 0; fi
            done
            echo "ERROR: 缺少 $DESC（LuCI 里选不到该协议）"; exit 1
          }
          check_any "LuCI PPPoE 协议" \
            /www/luci-static/resources/protocol/pppoe.js \
            /usr/lib/lua/luci/model/network/proto_pppoe.lua
          check_any "LuCI DHCPv6 协议" \
            /www/luci-static/resources/protocol/dhcpv6.js \
            /usr/lib/lua/luci/model/network/proto_dhcpv6.lua

          # ---- 包与内核模块 ----
          APKDB="$TARGET/lib/apk/db/installed"
          OPKGDB="$TARGET/usr/lib/opkg/status"
          need_pkg() {
            if [ -f "$APKDB" ]; then
              grep -qx "P:$1" "$APKDB" || { echo "ERROR: rootfs 里没有包 $1"; exit 1; }
            elif [ -f "$OPKGDB" ]; then
              grep -qx "Package: $1" "$OPKGDB" || { echo "ERROR: rootfs 里没有包 $1"; exit 1; }
            else
              echo "  WARN 读不到包数据库，跳过 pkg:$1"; return 0
            fi
            echo "  OK  pkg:$1"
          }

          PKG_CHECK="ppp ppp-mod-pppoe kmod-ppp kmod-pppox kmod-pppoe luci-proto-ppp odhcp6c odhcpd-ipv6only luci-proto-ipv6"
          if [ "${ENABLE_MOMO:-false}" = "true" ]; then
            PKG_CHECK="$PKG_CHECK $MOMO_PKGS"
          fi
          if [ "${ENABLE_MEOW:-false}" = "true" ]; then
            PKG_CHECK="$PKG_CHECK meow luci-app-meow"
          fi
          for P in $PKG_CHECK; do need_pkg "$P"; done

          for M in ppp_generic.ko pppox.ko pppoe.ko nft_tproxy.ko nft_socket.ko; do
            KO=$(find "$TARGET/lib/modules" -name "${M}*" | head -1)
            [ -n "$KO" ] || { echo "ERROR: 缺少内核模块 $M"; exit 1; }
            echo "  OK  ${KO#$TARGET}"
          done

          # ---- LAN IP 与 FIT ----
          LAN_DEFAULT=$(sed -n "s/.*network.lan.ipaddr='\([^']*\)'.*/\1/p" "$TARGET/etc/uci-defaults/98-n60pro-lan" | head -1)
          [ "$LAN_DEFAULT" = "$LAN_IP" ] || { echo "ERROR: rootfs 里 LAN IP 是 ${LAN_DEFAULT:-空}，期望 $LAN_IP"; exit 1; }
          echo "  OK  LAN IP = $LAN_DEFAULT"

          dumpimage -l itb-506m.itb | tee fit-506m.txt
          grep -q "Flat Device Tree" fit-506m.txt || { echo "ERROR: FIT 缺少 dtb"; exit 1; }
          grep -q "Filesystem" fit-506m.txt || { echo "ERROR: FIT 缺少 rootfs"; exit 1; }

          FDT_SHA=$(awk '/Image [0-9]+ \(/{img=$0} /Hash value:/{if (img ~ /fdt-1/ && prev ~ /sha1/) {print $3; exit}} {prev=$0}' fit-506m.txt)
          LOCAL_SHA=$(sha1sum dtb-506m.dtb | cut -d' ' -f1)
          [ -n "$FDT_SHA" ] && [ "$FDT_SHA" = "$LOCAL_SHA" ] \
            || { echo "ERROR: FIT 里的 dtb 不是我们改的那份"; exit 1; }
          echo "  OK  FIT 里的 dtb 与本地一致"

      # =====================================================================
      #  产物
      # =====================================================================
      - name: '[release] 收集产物'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          rm -rf "$OUT"; mkdir -p "$OUT"

          # 官方命名随版本变化（release 带版本前缀，snapshot 不带），用 glob 取再统一加 -506m
          SRC=$(ls "$IB_DIR"/bin/targets/mediatek/filogic/*squashfs-sysupgrade.itb 2>/dev/null | head -1 || true)
          [ -n "$SRC" ] || { echo "ERROR: 找不到 sysupgrade.itb"; ls -lh "$IB_DIR"/bin/targets/mediatek/filogic/ 2>/dev/null; exit 1; }
          NAME=$(basename "$SRC" | sed 's/-squashfs-sysupgrade\.itb$/-506m-squashfs-sysupgrade.itb/')
          cp -f "$IB_DIR/itb-506m.itb" "$OUT/$NAME"

          {
            echo "device  : Netcore ${DEVICE_NAME} (MT7986A / 512MB SPI NAND)"
            echo "source  : ${OPENWRT_DISTRIB} (${OPENWRT_BUILD})"
            echo "ubi     : ${UBI_506M}"
            echo "lan ip  : ${LAN_IP}"
            echo "momo    : ${MOMO_PKGS:-disabled} (branch ${MOMO_BRANCH:-n/a})"
            echo "singbox : ${SINGBOX_TAG:-disabled} (${SINGBOX_ASSET:-n/a})"
            echo "easytier: ${EASYTIER_TAG:-disabled}"
            echo "meow    : ${MEOW_TAG:-disabled}"
            echo "build   : $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$OUT/build-info.txt"

          ( cd "$OUT" && sha256sum * > sha256sums.txt )
          cat "$OUT/build-info.txt"

      - name: '[release] 发布到 Release'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          name: Netcore N60 Pro 506.5MB (easytier + meow)
          artifacts: out/*
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Netcore N60 Pro ｜ MT7986A / 512MB SPI NAND ｜ ubi `${{ env.UBI_506M }}`（506.5 MiB）
            构建源：${{ env.OPENWRT_DISTRIB }}（${{ env.OPENWRT_BUILD }}）｜ 默认 LAN `${{ env.LAN_IP }}`（中文界面）

            **预装**
            - meow-rs `${{ env.MEOW_TAG }}` + luci-app-meow
            - EasyTier `${{ env.EASYTIER_TAG }}` noweb（中文）
            - UPnP / PPPoE / IPv6 默认开启
            - kmod：mtd-rw / tun / dummy / nft-tproxy,socket,nat,fib / ppp,pppoe,ppox

            **meow**：`http://${{ env.LAN_IP }}` → 服务 → Meow
            - 配置在 LuCI 里编辑（tproxy / redirect / TUN），默认不自启动
            - `meow -v` 可确认版本

            **momo / sing-box**：默认不装。需要时把仓库变量 `ENABLE_MOMO` 设为 true，
            构建会一并安装 sing-box（上游 linux-arm64 musl 构建，覆盖 feed 版本）

            **刷机**：同为 506M 分区可直接 sysupgrade；从 128M 原厂跨过来必须先刷目标分区表的 recovery，且不保留配置

            **提示**：建议关掉 flow_offloading 与 packet_steering；
            snapshot 是滚动的，kmod 必须与镜像同批，升级请整包 sysupgrade。
