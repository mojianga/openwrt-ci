name: netcore-n60pro-imagebuilder-506m

# 思路（默认 ImmortalWrt snapshot，必要时可切官方 OpenWrt）：
#   1) ImageBuilder 组装 rootfs；source=immortalwrt（默认，snapshot）| openwrt（snapshot 或正式版）
#      官方 snapshot 的 feed 之前出现过半同步（procd 已更新但配套 libubox 没发），故默认走 ImmortalWrt
#      - 默认跟 snapshot（内核 6.18.x，最新驱动）
#      - 想要固定 ABI / 可复现就把 openwrt_version 填 25.12.6（内核 6.12.x）
#      - snapshot 是滚动的：kmod ABI 每天可能变，固件里的 kmod 必须与同一次构建的镜像配套
#   2) meow（https://github.com/meow-rs/meow-rs，Rust 版 mihomo/Clash Meta 内核）
#      官方直接产出 OpenWrt 包：meow_<ver>-r1_<arch>.apk + luci-app-meow_<ver>-r1_all.apk，
#      内含 /usr/bin/meow、/etc/init.d/meow（procd）、/etc/config/meow、/etc/meow/config.yaml
#      以及 LuCI「服务 → meow」面板（状态/配置编辑/客户端/tproxy 开关）。
#      meow 没有 apk feed，只能取 release 里的包；ImageBuilder 会把 packages/ 顶层的 *.apk
#      自动 apk mkndx 成 packages.adb，然后按包名安装。包未签名 → apk add 加 --allow-untrusted。
#      透明代理需要 kmod-nft-socket / kmod-nft-tproxy（默认 tproxy 模式）。
#   3) easytier 走 release 二进制（noweb）+ luci 源码 FILES 注入 + 中文 lmo
#   4) LuCI 界面必须装齐 luci/luci-base/luci-mod-*/主题/uhttpd/rpcd，只装 luci-compat 是没有页面的
#   5) 只做 506.5M 一种分区：改 build_dir 里的 image-*.dtb 的 ubi 分区，再跑一次 make image
#   6) 让 ImageBuilder 自己重打 FIT（hash/load/压缩/metadata 全自动），校验后再发布
#
# 触发方式：workflow_dispatch（可指定版本 / LAN IP）、点 star（watch: started）、每周日定时
#
# 注意（重要的刷机前提）：
#   - 默认跟 snapshot，每次构建的产物/内核都不一样；要固定版本就显式填 openwrt_version=25.12.6。
#   - 同分区间升级（506M -> 506M）可以直接 sysupgrade。
#   - 从 128M 原厂分区跨到 506M 必须用「目标分区表的内核」引导后刷写，
#     而 ImageBuilder 不产出 initramfs/recovery 镜像；这种情况下请用 buildroot 版
#     产出的 -recovery.itb 来刷，否则 UBI 会按旧分区边界创建。

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: '仅 source=openwrt 时生效：snapshot 跟主线 / 25.12.6 用正式版'
        required: false
        default: 'snapshot'
      meow_version:
        description: 'meow-rs tag（留空=latest，例如 v0.28.0）'
        required: false
        default: ''
      easytier_version:
        description: 'EasyTier tag（留空=latest）'
        required: false
        default: ''
      lan_ip:
        description: '默认 LAN IP'
        required: false
        default: '192.168.12.1'
      source:
        description: '构建源：immortalwrt（默认，feed 自洽）/ openwrt（官方源修好后可切）'
        required: false
        default: 'immortalwrt'
  # 点 star 触发；watch 事件只会触发「默认分支」上的 workflow
  watch:
    types: [started]
  # 定时触发（cron 只有 UTC，没有时区参数）：每周日 03:00 UTC = 北京 11:00
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # openwrt 源时：release 或 snapshot 由 OPENWRT_VER 决定，IB_URL 在下载步骤里拼
  OPENWRT_VER: ${{ github.event.inputs.openwrt_version || 'snapshot' }}
  # 默认走 ImmortalWrt snapshot（feed 自洽、两个机型都有）；官方源修好后可填 openwrt 切回去
  IB_SRC: ${{ github.event.inputs.source || 'immortalwrt' }}
  PROFILE: netcore_n60-pro
  PKG_ARCH: aarch64_cortex-a53
  DEVICE_NAME: netcore-n60-pro
  # 512MB NAND：ubi 起始 0x0580000 + 506.5MiB = 0x20000000
  UBI_506M: 0x0580000 0x1fa80000
  TAG: netcore-n60pro-ib-506m
  # LAN IP 抽成变量：workflow_dispatch 可覆盖，点 star / 定时触发时走默认值
  LAN_IP: ${{ github.event.inputs.lan_ip || '192.168.12.1' }}
  # 触发方式不同时 inputs 为空，统一用 env 兜底
  MEOW_TAG_INPUT: ${{ github.event.inputs.meow_version }}
  ET_TAG_INPUT: ${{ github.event.inputs.easytier_version }}
  # LuCI 界面必须显式装「框架 + 模块 + 主题 + web 服务」，只装 luci-compat/luci-lib-* 是没有页面的。
  #
  # PPPoE 拨号：ppp + ppp-mod-pppoe（用户态），kmod-ppp/pppoe/pppox（内核），luci-proto-ppp（界面）
  # IPv6：odhcp6c（WAN 侧 DHCPv6-PD 客户端，PPPoE 下拿前缀），odhcpd-ipv6only（LAN 侧 RA/DHCPv6），
  #       luci-proto-ipv6（界面）
  # meow：透明代理要 kmod-nft-socket / kmod-nft-tproxy，TUN 监听要 kmod-tun
  PKGS_PPPOE: ppp ppp-mod-pppoe kmod-ppp kmod-pppoe kmod-pppox luci-proto-ppp
  PKGS_IPV6: odhcp6c odhcpd-ipv6only luci-proto-ipv6
  PKGS_BASE: luci luci-base luci-mod-network luci-mod-system luci-mod-status luci-theme-bootstrap uhttpd uhttpd-mod-ubus rpcd rpcd-mod-luci rpcd-mod-file rpcd-mod-rrdns luci-compat luci-lua-runtime luci-lib-base luci-lib-ip luci-lib-jsonc luci-lib-nixio libubus-lua libuci-lua luci-i18n-base-zh-cn bash ca-bundle curl firewall4 ip-full meow luci-app-meow kmod-tun kmod-dummy kmod-mtd-rw kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-nft-fib kmod-inet-diag kmod-netlink-diag miniupnpd-nftables luci-app-upnp luci-i18n-upnp-zh-cn

jobs:
  build:
    name: ImageBuilder N60 Pro (506.5MB + meow)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # workflow_dispatch 随时可跑；star 触发默认不限制触发人（配仓库变量 STAR_ACTOR 可收紧）；
    # schedule 必须显式放行，否则配了 STAR_ACTOR 后定时任务会被静默 skip。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      vars.STAR_ACTOR == '' ||
      github.actor == vars.STAR_ACTOR

    steps:
      # 不依赖仓库里的任何文件，省掉一次 checkout
      - name: Prepare
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo -E apt-get -y update
          sudo -E apt-get -y install --no-install-recommends \
            zstd unzip jq device-tree-compiler u-boot-tools squashfs-tools \
            python3 curl gcc libc6-dev binutils file

      - name: Download ImageBuilder (official OpenWrt)
        run: |
          set -euo pipefail
          # 正式版的 imagebuilder 文件名带版本号（openwrt-imagebuilder-<ver>-mediatek-filogic...），
          # snapshot 不带；按顺序探一遍，省得换版本时手改
          if [ "$IB_SRC" = "immortalwrt" ] || [ "$IB_SRC" = "ImmortalWrt" ]; then
            BASE_URL=https://downloads.immortalwrt.org/snapshots
            DISTRIB=IMMORTALWRT-SNAPSHOT
            CANDIDATES="immortalwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst"
          else
            case "$OPENWRT_VER" in
              snapshot|SNAPSHOT|snapshots)
                BASE_URL=https://downloads.openwrt.org/snapshots
                DISTRIB=SNAPSHOT
                ;;
              *)
                BASE_URL=https://downloads.openwrt.org/releases/${OPENWRT_VER}
                DISTRIB=$OPENWRT_VER
                ;;
            esac
            CANDIDATES="openwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst"
            if [ "$DISTRIB" != "SNAPSHOT" ]; then
              CANDIDATES="openwrt-imagebuilder-${DISTRIB}-mediatek-filogic.Linux-x86_64.tar.zst ${CANDIDATES}"
            fi
          fi
          IB_FILE=""
          for NAME in $CANDIDATES; do
            if curl -fsIL --retry 2 --max-time 30 "${BASE_URL}/targets/mediatek/filogic/${NAME}" > /dev/null; then
              IB_FILE=$NAME
              break
            fi
          done
          [ -n "$IB_FILE" ] || { echo "ERROR: 在 $BASE_URL 找不到 $DISTRIB 的 ImageBuilder（版本号写错了？）"; exit 1; }

          IB_URL="${BASE_URL}/targets/mediatek/filogic/${IB_FILE}"
          echo "OpenWrt = $DISTRIB"
          echo "IB_URL  = $IB_URL"

          curl -fL --retry 3 --retry-delay 5 -o ib.tar.zst "$IB_URL"
          ls -lh ib.tar.zst
          tar --zstd -xf ib.tar.zst
          IB=$(ls -d "$PWD"/*imagebuilder-* | head -1)
          [ -d "$IB" ] || { echo "ERROR: 解压后没找到 ImageBuilder 目录"; ls -al; exit 1; }
          echo "IB_DIR=$IB" >> "$GITHUB_ENV"

          # 版本号（release 写 x.y.z，snapshot 取 git 描述），只用于 release 说明
          BUILDINFO=$(curl -fsSL --retry 3 "${BASE_URL}/targets/mediatek/filogic/version.buildinfo" | head -1 | tr -d '\r\n' || true)
          echo "OPENWRT_BUILD=${BUILDINFO:-$DISTRIB}" >> "$GITHUB_ENV"
          echo "OPENWRT_DISTRIB=$DISTRIB" >> "$GITHUB_ENV"
          echo "OpenWrt build = ${BUILDINFO:-$DISTRIB}"

          echo "ImageBuilder = $IB"
          ls -a "$IB" | head -30

      # meow 没有 apk feed，只能从 release 取包；丢进 ImageBuilder 的 packages/ 顶层，
      # IB 会自动 apk mkndx 生成 packages.adb，然后按包名安装（package_install 用 --no-scripts）
      - name: Fetch meow apk (+ allow untrusted)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$IB_DIR"

          TAG="${MEOW_TAG_INPUT:-}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   https://api.github.com/repos/meow-rs/meow-rs/releases/latest | jq -r '.tag_name')
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "ERROR: 取 meow 版本失败"; exit 1; }
          echo "meow tag = $TAG"

          # 按资产名匹配，避免 -r1/-r2 变动踩坑；同时避开 .ipk/.sha256/x86_64
          ASSETS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/meow-rs/meow-rs/releases/tags/${TAG}" \
                   | jq -r '.assets[].browser_download_url')
          MEOW_APK=$(printf '%s\n' "$ASSETS" | grep -E "/meow_[^/]*_${PKG_ARCH}\.apk$" | head -1)
          LUCI_APK=$(printf '%s\n' "$ASSETS" | grep -E "/luci-app-meow_[^/]*_all\.apk$" | head -1)
          [ -n "$MEOW_APK" ] || { echo "ERROR: release 里没有 meow 的 ${PKG_ARCH} apk"; printf '%s\n' "$ASSETS"; exit 1; }
          [ -n "$LUCI_APK" ] || { echo "ERROR: release 里没有 luci-app-meow 的 apk"; printf '%s\n' "$ASSETS"; exit 1; }

          # 必须放在 packages/ 顶层：IB 的 package_index 只 glob packages/*.apk（不递归）
          mkdir -p packages
          MEOW_FILE=$(basename "$MEOW_APK")
          LUCI_FILE=$(basename "$LUCI_APK")
          curl -fL --retry 3 -o "packages/$MEOW_FILE" "$MEOW_APK"
          curl -fL --retry 3 -o "packages/$LUCI_FILE" "$LUCI_APK"
          ls -lh packages/
          sha256sum packages/*.apk

          # meow 的包未签名，给 apk add 补 --allow-untrusted（IB 自带该参数时是 no-op）
          sed -i 's|[$](APK) add --arch|$(APK) add --allow-untrusted --arch|' Makefile
          grep -n "PK) add" Makefile | head -3 || true
          grep -q "allow-untrusted" Makefile \
            || echo "WARNING: Makefile 里没匹配到 apk add，靠 packages.adb 索引（可能装不上未签名包）"

          echo "MEOW_TAG=$TAG" >> "$GITHUB_ENV"
          echo "MEOW_PKG=$MEOW_FILE" >> "$GITHUB_ENV"

      - name: Fetch EasyTier binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pkgs/et
          TAG="${ET_TAG_INPUT:-}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   https://api.github.com/repos/EasyTier/EasyTier/releases/latest | jq -r '.tag_name')
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "ERROR: 取 EasyTier 版本失败"; exit 1; }
          echo "EasyTier tag = $TAG"

          URL="https://github.com/EasyTier/EasyTier/releases/download/${TAG}/easytier-linux-aarch64-${TAG}.zip"
          echo "URL=$URL"
          curl -fL --retry 3 -o pkgs/easytier.zip "$URL"
          unzip -o -j pkgs/easytier.zip -d pkgs/et
          ls -l pkgs/et
          [ -f pkgs/et/easytier-core ] || { echo "ERROR: zip 里没有 easytier-core"; exit 1; }
          echo "EASYTIER_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build FILES overlay (easytier + luci + i18n)
        run: |
          set -euo pipefail
          rm -rf files
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git et-src

          mkdir -p files/usr/bin
          # easytier 用 noweb 形态：只装 core + cli，不装 easytier-web / easytier-web-embed，
          # 免得固件里多一个 8080 端口的 web 服务和它带来的依赖。
          cp -a pkgs/et/easytier-core pkgs/et/easytier-cli files/usr/bin/
          if [ -e pkgs/et/easytier-web-embed ] || [ -e pkgs/et/easytier-web ]; then
            echo "检测到 easytier-web，按 noweb 策略不安装"
          fi
          chmod 0755 files/usr/bin/easytier-*

          # luci：luasrc -> /usr/lib/lua/luci，root -> /
          mkdir -p files/usr/lib/lua/luci
          cp -a et-src/luci-app-easytier/luasrc/. files/usr/lib/lua/luci/
          cp -a et-src/luci-app-easytier/root/. files/
          find files/etc -type f \( -name "*.sh" -o -path "files/etc/init.d/*" -o -path "files/etc/uci-defaults/*" \) -exec chmod 0755 {} +
          chmod 0755 files/usr/bin/*

          # 中文翻译：po2lmo 必须走上游 Makefile（依赖 lib/lmo.c 与 lemon 生成的 plural_formula.c，
          # 单独 gcc po2lmo.c 会报 undefined reference to sfh_hash）
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openwrt/luci.git luci-src
          git -C luci-src sparse-checkout set modules/luci-base/src
          make -C luci-src/modules/luci-base/src po2lmo
          [ -x luci-src/modules/luci-base/src/po2lmo ] || { echo "ERROR: po2lmo 构建失败"; exit 1; }

          mkdir -p files/usr/lib/lua/luci/i18n
          luci-src/modules/luci-base/src/po2lmo \
            et-src/luci-app-easytier/po/zh_Hans/easytier.po \
            files/usr/lib/lua/luci/i18n/easytier.zh-cn.lmo
          [ -s files/usr/lib/lua/luci/i18n/easytier.zh-cn.lmo ] || { echo "ERROR: easytier 中文 lmo 生成失败"; exit 1; }
          ls -l files/usr/lib/lua/luci/i18n/

          # 局域网地址（uci-defaults 在 network 服务启动前执行，直接生效）
          mkdir -p files/etc/uci-defaults
          printf '%s\n' \
            '#!/bin/sh' \
            "uci -q set network.lan.ipaddr='${LAN_IP}'" \
            "uci -q set network.lan.netmask='255.255.255.0'" \
            'uci -q commit network' \
            'exit 0' \
            > files/etc/uci-defaults/98-n60pro-lan
          chmod 0755 files/etc/uci-defaults/98-n60pro-lan
          echo "LAN IP = $LAN_IP"

          # 默认中文界面（用 printf 写，避免 heredoc 破坏 YAML 缩进）
          printf '%s\n' '#!/bin/sh' "uci -q set luci.main.lang='zh_cn'" 'uci -q commit luci' 'exit 0' \
            > files/etc/uci-defaults/99-n60pro-lang
          chmod 0755 files/etc/uci-defaults/99-n60pro-lang

          echo "===== FILES 预览 ====="
          find files -type f | head -40

      # 不再手工拆 FIT：直接把改好的 dtb 放进 build_dir，让 ImageBuilder 自己重打镜像，
      # hash / load 地址 / 压缩方式 / metadata 全部由官方规则处理（dumpimage 在该版本无法提取子镜像）
      # 第一次 make image 只为拿到 build_dir 里的 dtb 与 rootfs，128M 的原镜像直接丢弃。
      - name: Build 506M image (patch dtb + make image)
        run: |
          set -euo pipefail
          cd "$IB_DIR"
          PACKAGES="$PKGS_BASE $PKGS_PPPOE $PKGS_IPV6"
          echo "PACKAGES=$PACKAGES"

          # 只跑一次，不重试：失败就把原因和人话建议打出来
          build_image() {
            if make image PROFILE="$PROFILE" FILES="$GITHUB_WORKSPACE/files" PACKAGES="$PACKAGES" > build.log 2>&1; then
              return 0
            fi
            tail -40 build.log
            echo "---------- 失败原因（包名缺失）----------"
            { grep -oE "Unknown package '[^']+'" build.log | sed -E "s/.*'(.*)'/\1/" || true
              grep -oE "[A-Za-z0-9._+-]+ \(no such package\)" build.log | sed 's/ (no such package)//' || true
            } | sort -u | sed 's/^/  缺: /'
            echo "----------------------------------------"
            echo "如果缺的是 libubox20xxxxxx / libblobmsg-json20xxxxxx 这类库，说明上游 feed 正在重建"
            echo "（procd 已更新但配套 libubox 还没发出来），跟本文件的包列表无关。可选："
            echo "  1) 把 source 填回 immortalwrt（默认值，feed 自洽）"
            echo "  2) 如果已在 immortalwrt 上失败，过几小时重跑；或用 source=openwrt + openwrt_version=25.12.6"
            return 1
          }

          echo "=== 第 1 次 make image：生成 build_dir 里的 dtb ==="
          build_image

          DTB=$(find build_dir -name "image-mt7986a-netcore-n60-pro.dtb" | head -1)
          [ -n "$DTB" ] || { echo "ERROR: build_dir 里找不到 dtb"; find build_dir -name "*.dtb" | head; exit 1; }
          echo "dtb = $DTB"

          cp -f "$DTB" dtb.orig
          dtc -I dtb -O dts dtb.orig -o dtb.orig.dts
          echo "--- 原始 ubi 分区（仅参考）---"
          grep -A3 'label = "ubi"' dtb.orig.dts || true

          set -- $UBI_506M
          OFF="$1"
          SIZE="$2"

          # 按 ubi 分区起始地址 0x580000 定位那一行 reg 直接替换：
          # 不用 awk 数组（CI 的 mawk 上未能生效），不用 \+（BSD sed 不认），也不依赖 label/reg 的先后顺序
          sed -E "s/reg = <0x0*580000 0x[0-9a-fA-F]+>;/reg = <${OFF} ${SIZE}>;/" dtb.orig.dts > patched.dts
          if cmp -s dtb.orig.dts patched.dts; then
            echo "ERROR: 没替换到 ubi 的 reg（dts 里找不到 0x580000 起始的分区行）"
            grep -A3 'label = "ubi"' dtb.orig.dts || true
            exit 1
          fi
          dtc -q -I dts -O dtb -o dtb-506m.dtb patched.dts
          echo "--- dtb-506m.dtb ---"
          dtc -I dtb -O dts dtb-506m.dtb | grep -A3 'label = "ubi"' || true

          # 断言：dtc 反编译会把前导 0 去掉（0x0580000 -> 0x580000），所以必须按数值比较
          REG=$(dtc -I dtb -O dts dtb-506m.dtb | grep -A3 'label = "ubi"' | sed -n 's/.*reg = <\([^>]*\)>;.*/\1/p' | head -1)
          echo "ubi reg = <$REG>"
          set -- $REG
          [ $# -ge 2 ] || { echo "ERROR: 解析 dtb 里的 ubi reg 失败"; exit 1; }
          [ "$(( $1 ))" -eq "$(( OFF ))" ] && [ "$(( $2 ))" -eq "$(( SIZE ))" ] \
            || { echo "ERROR: dtb 分区不对，期望 <$OFF $SIZE> 实际 <$REG>"; exit 1; }

          echo "=== 第 2 次 make image：用改好的 dtb 重打 FIT ==="
          cp -f dtb-506m.dtb "$DTB"
          rm -f bin/targets/mediatek/filogic/*sysupgrade.itb
          build_image

          NEW=$(ls bin/targets/mediatek/filogic/*squashfs-sysupgrade.itb 2>/dev/null | head -1)
          [ -n "$NEW" ] || { echo "ERROR: 没有产出 sysupgrade.itb"; ls -l bin/targets/mediatek/filogic; exit 1; }
          cp -f "$NEW" itb-506m.itb
          ls -lh itb-506m.itb

      - name: Verify rootfs & itb
        run: |
          set -euo pipefail
          cd "$IB_DIR"

          # ---------- rootfs 校验：ImageBuilder 的 TARGET_DIR 在 make image 后仍保留 ----------
          TARGET=$(find build_dir -maxdepth 3 -type d -name "root-*" | head -1)
          [ -n "$TARGET" ] || { echo "ERROR: 找不到 TARGET_DIR，无法校验 rootfs"; exit 1; }

          # 1) meow 必须是 aarch64 且文件布局齐全（包来自 release，架构选错这里能看出来）
          [ -f "$TARGET/usr/bin/meow" ] || { echo "ERROR: rootfs 里没有 /usr/bin/meow"; exit 1; }
          if file -b "$TARGET/usr/bin/meow" | grep -q aarch64; then
            echo "  OK  meow 架构 aarch64"
          else
            echo "ERROR: /usr/bin/meow 不是 aarch64"; file "$TARGET/usr/bin/meow"; exit 1
          fi

          # 2) easytier 必须是 noweb 形态：不应该有 easytier-web
          if [ -e "$TARGET/usr/bin/easytier-web" ] || [ -e "$TARGET/usr/bin/easytier-web-embed" ]; then
            echo "ERROR: 固件里出现了 easytier-web，应为 noweb 形态"
            exit 1
          fi

          # 3) LuCI / meow / PPPoE / IPv6 关键件在位
          #    注意：rpcd 在 OpenWrt 里装到 /sbin/rpcd（不是 /usr/sbin/rpcd），两个路径都认
          RPCD=""
          for C in /sbin/rpcd /usr/sbin/rpcd; do
            if [ -x "$TARGET$C" ]; then RPCD="$C"; break; fi
          done
          [ -n "$RPCD" ] || { echo "ERROR: rootfs 里没有 rpcd（/sbin 或 /usr/sbin）"; exit 1; }
          echo "  OK  $RPCD"

          for F in /usr/sbin/uhttpd \
                   /www/luci-static/bootstrap/cascade.css \
                   /etc/init.d/meow /etc/config/meow /etc/meow/config.yaml \
                   /usr/lib/lua/luci/controller/easytier.lua \
                   /usr/lib/lua/luci/i18n/easytier.zh-cn.lmo \
                   /usr/sbin/pppd /usr/sbin/odhcp6c /usr/sbin/odhcpd; do
            [ -e "$TARGET$F" ] || { echo "ERROR: rootfs 缺少 $F"; exit 1; }
            echo "  OK  $F"
          done

          # luci-app-meow 的菜单路径随版本变（JS 在 menu.d，老式 Lua 在 controller），只告警
          MEOW_MENU=""
          for M in /usr/share/luci/menu.d/luci-app-meow.json /usr/share/luci/menu.d/meow.json \
                   /usr/lib/lua/luci/controller/meow.lua; do
            if [ -e "$TARGET$M" ]; then MEOW_MENU=$M; break; fi
          done
          [ -n "$MEOW_MENU" ] && echo "  OK  LuCI 菜单 -> $MEOW_MENU" \
            || echo "  WARN 没找到 luci-app-meow 的菜单文件（包已装，可能改了路径）"

          # PPPoE 插件路径带 pppd 版本号，文件名是 pppoe.so
          # （rp-pppoe.so 是 Debian/Ubuntu 的叫法，OpenWrt 的 ppp-mod-pppoe 装的是 pppoe.so）
          PPPOE_SO=$(ls "$TARGET"/usr/lib/pppd/*/pppoe.so 2>/dev/null | head -1)
          if [ -z "$PPPOE_SO" ]; then
            echo "ERROR: 缺少 pppd 的 pppoe.so 插件，PPPoE 拨号不可用"
            ls -R "$TARGET/usr/lib/pppd" 2>/dev/null | head -20
            exit 1
          fi
          echo "  OK  ${PPPOE_SO#$TARGET}"

          # 3b) 包与内核模块必须在位（避免模板改动后静默丢包）
          #     优先读 apk 数据库，老版本回退 opkg status；读不到就只告警不误杀
          APKDB="$TARGET/lib/apk/db/installed"
          OPKGDB="$TARGET/usr/lib/opkg/status"
          need_pkg() {
            if [ -f "$APKDB" ]; then
              grep -qx "P:$1" "$APKDB" || { echo "ERROR: rootfs 里没有包 $1"; exit 1; }
            elif [ -f "$OPKGDB" ]; then
              grep -qx "Package: $1" "$OPKGDB" || { echo "ERROR: rootfs 里没有包 $1"; exit 1; }
            else
              echo "  WARN 读不到包数据库，跳过 pkg:$1"
              return 0
            fi
            echo "  OK  pkg:$1"
          }

          for P in meow luci-app-meow \
                   ppp ppp-mod-pppoe kmod-ppp kmod-pppox kmod-pppoe luci-proto-ppp \
                   odhcp6c odhcpd-ipv6only luci-proto-ipv6; do
            need_pkg "$P"
          done

          # 内核模块（kmod 包装了，.ko 也必须在；pppoe 依赖 pppox，pppox 依赖 ppp_generic；
          # nft_tproxy/nft_socket 是 meow 透明代理的硬依赖）
          for M in ppp_generic.ko pppox.ko pppoe.ko nft_tproxy.ko nft_socket.ko; do
            KO=$(find "$TARGET/lib/modules" -name "${M}*" | head -1)
            [ -n "$KO" ] || { echo "ERROR: 缺少内核模块 $M"; exit 1; }
            echo "  OK  ${KO#$TARGET}"
          done

          # LuCI 的协议处理器：新版是 JS（/www/luci-static/resources/protocol），
          # 老版/兼容层是 Lua（/usr/lib/lua/luci/model/network），两种都认
          check_any() {
            DESC="$1"; shift
            for p in "$@"; do
              if [ -e "$TARGET$p" ]; then echo "  OK  $DESC -> $p"; return 0; fi
            done
            echo "ERROR: 缺少 $DESC（LuCI 里选不到该协议）"
            exit 1
          }
          check_any "LuCI PPPoE 协议" \
            /www/luci-static/resources/protocol/pppoe.js \
            /usr/lib/lua/luci/model/network/proto_pppoe.lua
          check_any "LuCI DHCPv6 协议" \
            /www/luci-static/resources/protocol/dhcpv6.js \
            /usr/lib/lua/luci/model/network/proto_dhcpv6.lua

          # IPv6 默认放行到 LAN：RA / DHCPv6 服务端（base-files 默认配置，只做告警）
          if grep -Eq "option (ra|dhcpv6) '(server|hybrid)'" "$TARGET/etc/config/dhcp" 2>/dev/null; then
            echo "  OK  /etc/config/dhcp 默认开启 RA / DHCPv6"
            grep -E "option (ra|dhcpv6) " "$TARGET/etc/config/dhcp" | head -4 || true
          else
            echo "  WARN /etc/config/dhcp 里没看到 ra/dhcpv6=server，LAN 侧 IPv6 可能要在 LuCI 里手工开"
          fi

          # WAN6 接口（PPPoE 下由 @wan 派生，负责 DHCPv6-PD 拿前缀）
          if grep -q "config interface 'wan6'" "$TARGET/etc/config/network" 2>/dev/null; then
            echo "  OK  /etc/config/network 里有 wan6"
          else
            echo "  WARN /etc/config/network 里没有 wan6（PPPoE 下需要手工加个 DHCPv6 客户端接口）"
          fi

          # 4) 确认 uci-defaults 里的 LAN IP 就是目标值（防止模板变量没展开）
          LAN_DEFAULT=$(sed -n "s/.*network.lan.ipaddr='\([^']*\)'.*/\1/p" "$TARGET/etc/uci-defaults/98-n60pro-lan" | head -1)
          echo "rootfs 默认 LAN IP = ${LAN_DEFAULT:-<空>}"
          [ "$LAN_DEFAULT" = "$LAN_IP" ] || { echo "ERROR: rootfs 里的 LAN IP 与期望的 $LAN_IP 不一致"; exit 1; }

          # ---------- FIT 校验 ----------
          dumpimage -l itb-506m.itb | tee fit-506m.txt
          grep -q "Flat Device Tree" fit-506m.txt || { echo "ERROR: 缺少 dtb"; exit 1; }
          grep -q "Filesystem" fit-506m.txt || { echo "ERROR: 缺少 rootfs"; exit 1; }

          FDT_SHA=$(awk '/Image [0-9]+ \(/{img=$0} /Hash value:/{if (img ~ /fdt-1/ && prev ~ /sha1/) {print $3; exit}} {prev=$0}' fit-506m.txt)
          LOCAL_SHA=$(sha1sum dtb-506m.dtb | cut -d' ' -f1)
          echo "fdt sha1 in itb = $FDT_SHA"
          echo "local dtb sha1  = $LOCAL_SHA"
          [ -n "$FDT_SHA" ] && [ "$FDT_SHA" = "$LOCAL_SHA" ] || { echo "ERROR: itb 里的 dtb 不是我们改的那份"; exit 1; }

          sha256sum itb-506m.itb | tee itb-506m.sha256

      - name: Collect artifacts
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          rm -rf "$OUT"; mkdir -p "$OUT"

          # 官方命名随版本变化（release 带版本前缀，snapshot 不带），所以用 glob 取，
          # 再统一插一个 -506m 后缀，产物名保持稳定
          SRC=$(ls "$IB_DIR"/bin/targets/mediatek/filogic/*squashfs-sysupgrade.itb | head -1)
          NAME=$(basename "$SRC" | sed 's/-squashfs-sysupgrade\.itb$/-506m-squashfs-sysupgrade.itb/')
          cp -f "$IB_DIR/itb-506m.itb" "$OUT/$NAME"

          {
            echo "device  : Netcore ${DEVICE_NAME} (MT7986A / 512MB SPI NAND)"
            echo "openwrt : ${OPENWRT_DISTRIB} (${OPENWRT_BUILD})"
            echo "ubi     : ${UBI_506M}"
            echo "lan ip  : ${LAN_IP}"
            echo "meow    : ${MEOW_TAG}  (${MEOW_PKG})"
            echo "easytier: ${EASYTIER_TAG}"
            echo "build   : $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$OUT/build-info.txt"

          ( cd "$OUT" && sha256sum * > sha256sums.txt )
          cat "$OUT/build-info.txt"
          ls -lh "$OUT"

      - name: Upload Firmware To Release (506M)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          name: Netcore N60 Pro ImageBuilder 506.5MB (meow)
          body: |
            Netcore N60 Pro / MT7986A / 512MB SPI NAND
            构建源：${{ env.OPENWRT_DISTRIB }}（${{ env.OPENWRT_BUILD }}）
            ubi 分区：${{ env.UBI_506M }}（506.5 MiB，起始 0x0580000）
            默认地址：${{ env.LAN_IP }}
            预装：meow ${{ env.MEOW_TAG }}（含中文 LuCI）、easytier ${{ env.EASYTIER_TAG }} noweb（含中文 LuCI）、UPnP（含中文 LuCI）
            内核模块：kmod-mtd-rw、kmod-tun、kmod-dummy、kmod-nft-tproxy/socket/nat/fib、kmod-ppp/pppoe/pppox
            拨号：支持 PPPoE（ppp + ppp-mod-pppoe + luci-proto-ppp，LuCI 协议里可选）
            IPv6：默认开启（odhcp6c 拿 DHCPv6-PD，odhcpd 下发 RA/DHCPv6，luci-proto-ipv6 可配）
            界面：完整 LuCI（luci-base + luci-mod-network/system/status + bootstrap 主题 + uhttpd + rpcd），默认中文
            meow：Rust 版 mihomo（Clash Meta）内核，LuCI「服务 → meow」里配置
            easytier：noweb 形态，仅 easytier-core + easytier-cli，不含 easytier-web/easytier-web-embed
            Shell：预装 bash（默认 shell 仍为 busybox ash，需要时 `bash` 进入）

            meow 使用：
            1. 打开 http://${{ env.LAN_IP }} → 服务 → meow
            2. 「Configuration」里粘贴 Clash/mihomo 格式 YAML（保存前会用 `meow -t` 校验）
            3. 「Settings」里勾启用并打开透明代理（默认 tproxy；redirect 为 TCP-only）
            4. 「Panel」是 meow 自带 Web 面板（端口/密钥也在 Settings 里改）
            配置文件 /etc/meow/config.yaml，UCI /etc/config/meow；默认不自启动，配好再开。

            刷机：
            - 已经是 506M 分区：直接 sysupgrade（可保留配置）
            - 从 128M 原厂分区跨过来：必须先用目标分区表的内核（recovery）引导再刷，且不要保留配置
            - meow / TUN / easytier 都是用户态处理，建议关掉 packet steering 与 flow offloading：
              ```
              uci set network.@device[0].packet_steering='0'
              uci set firewall.@defaults[0].flow_offloading='0'
              uci set firewall.@defaults[0].flow_offloading_hw='0'
              uci commit && /etc/init.d/network reload && /etc/init.d/firewall restart
              ```

            说明：meow 的包未签名（构建时用 --allow-untrusted 装进去），后续升级请用
            `apk add --allow-untrusted ./meow_<ver>-r1_<arch>.apk`。
            snapshot 是滚动版本，内核与 kmod ABI 会变，kmod 必须与镜像来自同一次构建；
            升级请整包 sysupgrade，不要往 snapshot 机器上装正式版 kmod（反之亦然）。
          artifacts: out/*
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
