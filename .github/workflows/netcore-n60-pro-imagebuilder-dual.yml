name: netcore-n60pro-imagebuilder-dual

# 思路：
#   1) 官方 ImageBuilder 组装 rootfs（momo/meow 走 apk，easytier 走 release 二进制 + luci 源码 FILES 注入）
#   2) sing-box 仍然装 immortalwrt 的包（满足 momo 依赖、提供 init/config），但二进制用官方 release 覆盖
#   3) 改 build_dir 里的 image-*.dtb 的 ubi 分区为 506.5M / 490M，再各跑一次 make image
#   4) 让 ImageBuilder 自己重打 FIT（hash/load/压缩/metadata 全自动），校验后再发布
#
# 触发方式：workflow_dispatch（可指定版本）或 点 star（watch: started，全部取 latest）
#
# 注意（重要的刷机前提）：
#   - 同分区间升级（506M -> 506M、490M -> 490M）可以直接 sysupgrade。
#   - 跨分区（128M/506M/490M 之间互刷）必须用「目标分区表的内核」引导后刷写，
#     而 ImageBuilder 不产出 initramfs/recovery 镜像；这种情况下请用 buildroot 版
#     netcore-n60-pro-immortal-dual.yml 产出的 -recovery.itb 来刷，否则 UBI 会按旧分区边界创建。

on:
  workflow_dispatch:
    inputs:
      easytier_version:
        description: 'EasyTier tag（留空=latest）'
        required: false
        default: ''
      meow_version:
        description: 'meow tag（留空=latest）'
        required: false
        default: ''
      singbox_version:
        description: 'sing-box tag（留空=latest 稳定版）'
        required: false
        default: ''
  # 点 star 触发；watch 事件只会触发「默认分支」上的 workflow
  watch:
    types: [started]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  IB_URL: https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic/immortalwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst
  PROFILE: netcore_n60-pro
  PKG_ARCH: aarch64_cortex-a53
  MOMO_REPO: https://momomomo.pages.dev/SNAPSHOT/aarch64_cortex-a53/momo
  DEVICE_NAME: netcore-n60-pro
  UBI_506M: 0x0580000 0x1fa80000
  UBI_490M: 0x0580000 0x1ea00000
  PKGS_BASE: luci-compat luci-lua-runtime luci-lib-base luci-lib-ip luci-lib-jsonc luci-lib-nixio libubus-lua libuci-lua luci-i18n-base-zh-cn ca-bundle curl firewall4 ip-full kmod-tun kmod-dummy kmod-mtd-rw kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-nft-fib kmod-inet-diag kmod-netlink-diag miniupnpd-nftables luci-app-upnp luci-i18n-upnp-zh-cn sing-box momo luci-app-momo luci-i18n-momo-zh-cn
  TAG_506M: netcore-n60pro-ib-506m
  TAG_490M: netcore-n60pro-ib-490m

jobs:
  build:
    name: ImageBuilder N60 Pro (506M + 490M)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # workflow_dispatch 随时可跑；star 触发默认不限制触发人。
    # 想在公开仓库里只允许特定账号点星触发，就配仓库变量 STAR_ACTOR=<用户名>，
    # 配了之后只有该账号的 star 才会启动构建。
    if: github.event_name == 'workflow_dispatch' || vars.STAR_ACTOR == '' || github.actor == vars.STAR_ACTOR

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Prepare
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install zstd unzip jq device-tree-compiler u-boot-tools squashfs-tools python3 curl gcc libc6-dev

      - name: Download ImageBuilder
        run: |
          curl -fL --retry 3 --retry-delay 5 -o ib.tar.zst "$IB_URL"
          ls -lh ib.tar.zst
          tar --zstd -xf ib.tar.zst
          IB=$(ls -d "$PWD"/immortalwrt-imagebuilder-*)
          [ -d "$IB" ] || { echo "ERROR: 解压后没找到 ImageBuilder 目录"; ls -al; exit 1; }
          echo "IB_DIR=$IB" >> $GITHUB_ENV
          echo "ImageBuilder = $IB"
          ls -a "$IB" | head -30

      - name: Add momo apk repository
        run: |
          cd "$IB_DIR"
          if [ -f repositories ]; then
            REPO_FILE=repositories
          elif [ -f repositories.conf ]; then
            REPO_FILE=repositories.conf
          else
            echo "ERROR: 找不到 repositories / repositories.conf"
            ls -a
            exit 1
          fi
          # apk 3 的仓库条目要指向索引文件本身（写目录会被拼成 <dir>/<arch>/APKINDEX.tar.gz）
          case "$REPO_FILE" in
            repositories)      echo "$MOMO_REPO/packages.adb" >> "$REPO_FILE" ;;
            repositories.conf) echo "src/gz momo $MOMO_REPO" >> "$REPO_FILE" ;;
          esac
          mkdir -p keys
          curl -fsSL --retry 3 https://momomomo.pages.dev/public-key.pem -o keys/momo.pem
          echo "REPO_FILE=$REPO_FILE" >> $GITHUB_ENV
          echo "--- $REPO_FILE ---"
          cat "$REPO_FILE"
          echo "--- keys ---"
          ls -l keys

      - name: Allow untrusted apk (meow 的 apk 没有公钥)
        run: |
          cd "$IB_DIR"
          cp Makefile Makefile.orig
          # ImageBuilder 的 package_install 实际执行：
          #   $(APK) add --arch $(ARCH_PACKAGES) --no-scripts $(BUILD_PACKAGES)
          sed -i 's|[$](APK) add --arch|$(APK) add --allow-untrusted --arch|' Makefile
          grep -n "PK) add" Makefile
          grep -q "allow-untrusted" Makefile || { echo "ERROR: 没能给 apk add 加上 --allow-untrusted"; sed -n '255,275p' Makefile; exit 1; }

      - name: Fetch EasyTier binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pkgs/et
          TAG="${{ inputs.easytier_version }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   https://api.github.com/repos/EasyTier/EasyTier/releases/latest \
                 | jq -r '.tag_name')
          fi
          [ -n "$TAG" ] || { echo "ERROR: 取 EasyTier 版本失败"; exit 1; }
          echo "EasyTier tag = $TAG"
          URL="https://github.com/EasyTier/EasyTier/releases/download/${TAG}/easytier-linux-aarch64-${TAG}.zip"
          echo "URL=$URL"
          curl -fL --retry 3 -o pkgs/easytier.zip "$URL"
          unzip -o -j pkgs/easytier.zip -d pkgs/et
          ls -l pkgs/et
          [ -f pkgs/et/easytier-core ] || { echo "ERROR: zip 里没有 easytier-core"; exit 1; }

      - name: Fetch meow apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pkgs
          TAG="${{ inputs.meow_version }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   https://api.github.com/repos/meow-rs/meow-rs/releases/latest \
                 | jq -r '.tag_name')
          fi
          [ -n "$TAG" ] || { echo "ERROR: 取 meow 版本失败"; exit 1; }
          echo "meow tag = $TAG"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/meow-rs/meow-rs/releases/tags/${TAG}" > /tmp/meow.json
          MEOW_URL=$(jq -r '.assets[].browser_download_url' /tmp/meow.json \
                     | grep -E "/meow_[^/]*_${PKG_ARCH}\.apk\$" | head -1)
          LUCI_URL=$(jq -r '.assets[].browser_download_url' /tmp/meow.json \
                     | grep -E "/luci-app-meow_[^/]*_all\.apk\$" | head -1)
          [ -n "$MEOW_URL" ] || { echo "ERROR: 没找到 meow 的 ${PKG_ARCH} apk"; jq -r '.assets[].name' /tmp/meow.json; exit 1; }
          [ -n "$LUCI_URL" ] || { echo "ERROR: 没找到 luci-app-meow apk"; jq -r '.assets[].name' /tmp/meow.json; exit 1; }
          echo "meow: $MEOW_URL"
          echo "luci: $LUCI_URL"
          curl -fL --retry 3 -o pkgs/meow.apk "$MEOW_URL"
          curl -fL --retry 3 -o pkgs/luci-app-meow.apk "$LUCI_URL"
          ls -lh pkgs/*.apk

      - name: Fetch official sing-box (replace immortalwrt's old one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pkgs
          TAG="${{ inputs.singbox_version }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   https://api.github.com/repos/SagerNet/sing-box/releases/latest \
                 | jq -r '.tag_name')
          fi
          [ -n "$TAG" ] || { echo "ERROR: 取 sing-box 版本失败"; exit 1; }
          VER=${TAG#v}
          echo "sing-box tag = $TAG"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          if ! { [ "$MAJOR" -ge 1 ] && [ "$MINOR" -ge 12 ]; }; then
            echo "ERROR: sing-box $VER < 1.12，momo 不兼容"
            exit 1
          fi
          URL="https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VER}-linux-arm64.tar.gz"
          echo "URL=$URL"
          curl -fL --retry 3 -o pkgs/sing-box.tar.gz "$URL"
          tar -xzf pkgs/sing-box.tar.gz -C pkgs
          BIN=$(find pkgs -type f -path "*sing-box-${VER}-linux-arm64/sing-box" | head -1)
          [ -n "$BIN" ] || BIN=$(find pkgs -type f -name sing-box | head -1)
          [ -n "$BIN" ] || { echo "ERROR: 解压后没找到 sing-box 二进制"; find pkgs -maxdepth 3; exit 1; }
          install -m 0755 "$BIN" pkgs/sing-box-bin
          echo "=== 二进制信息 ==="
          file pkgs/sing-box-bin
          case "$(file -b pkgs/sing-box-bin)" in
            *aarch64*|*ARM*) echo "架构 OK" ;;
            *) echo "ERROR: sing-box 二进制架构不对"; exit 1 ;;
          esac
          ls -lh pkgs/sing-box-bin

      - name: Build FILES overlay (easytier + luci + i18n)
        run: |
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git et-src

          mkdir -p files/usr/bin
          cp -a pkgs/et/easytier-core pkgs/et/easytier-cli files/usr/bin/
          if [ -f pkgs/et/easytier-web-embed ]; then
            cp -a pkgs/et/easytier-web-embed files/usr/bin/easytier-web
          elif [ -f pkgs/et/easytier-web ]; then
            cp -a pkgs/et/easytier-web files/usr/bin/easytier-web
          fi
          chmod 0755 files/usr/bin/easytier-*

          # 官方 sing-box 覆盖 immortalwrt 包里的旧二进制（FILES 在包安装之后拷贝）
          install -D -m 0755 pkgs/sing-box-bin files/usr/bin/sing-box

          # luci：luasrc -> /usr/lib/lua/luci，root -> /
          mkdir -p files/usr/lib/lua/luci
          cp -a et-src/luci-app-easytier/luasrc/. files/usr/lib/lua/luci/
          cp -a et-src/luci-app-easytier/root/. files/
          find files/etc -type f \( -name "*.sh" -o -path "files/etc/init.d/*" -o -path "files/etc/uci-defaults/*" \) -exec chmod 0755 {} +
          chmod 0755 files/usr/bin/*

          # 中文翻译：po2lmo 必须走上游 Makefile（依赖 lib/lmo.c 与 lemon 生成的 plural_formula.c，
          # 单独 gcc po2lmo.c 会报 undefined reference to sfh_hash）
          git clone --depth 1 --filter=blob:none --sparse https://github.com/immortalwrt/luci.git luci-src
          git -C luci-src sparse-checkout set modules/luci-base/src
          make -C luci-src/modules/luci-base/src po2lmo
          [ -x luci-src/modules/luci-base/src/po2lmo ] || { echo "ERROR: po2lmo 构建失败"; exit 1; }

          mkdir -p files/usr/lib/lua/luci/i18n
          luci-src/modules/luci-base/src/po2lmo \
            et-src/luci-app-easytier/po/zh_Hans/easytier.po \
            files/usr/lib/lua/luci/i18n/easytier.zh-cn.lmo
          [ -s files/usr/lib/lua/luci/i18n/easytier.zh-cn.lmo ] || { echo "ERROR: easytier 中文 lmo 生成失败"; exit 1; }
          ls -l files/usr/lib/lua/luci/i18n/

          # 局域网地址改成 192.168.12.1（uci-defaults 在 network 服务启动前执行，直接生效）
          mkdir -p files/etc/uci-defaults
          printf '%s\n' \
            '#!/bin/sh' \
            "uci -q set network.lan.ipaddr='192.168.12.1'" \
            "uci -q set network.lan.netmask='255.255.255.0'" \
            'uci -q commit network' \
            'exit 0' \
            > files/etc/uci-defaults/98-n60pro-lan
          chmod 0755 files/etc/uci-defaults/98-n60pro-lan

          # 默认中文界面（用 printf 写，避免 heredoc 破坏 YAML 缩进）
          printf '%s\n' '#!/bin/sh' "uci -q set luci.main.lang='zh_cn'" 'uci -q commit luci' 'exit 0' \
            > files/etc/uci-defaults/99-n60pro-lang
          chmod 0755 files/etc/uci-defaults/99-n60pro-lang

          echo "===== FILES 预览 ====="
          find files -type f | head -40

      - name: Make image (baseline, 128M layout)
        run: |
          cd "$IB_DIR"
          PACKAGES="$PKGS_BASE $GITHUB_WORKSPACE/pkgs/meow.apk $GITHUB_WORKSPACE/pkgs/luci-app-meow.apk"
          make image PROFILE="$PROFILE" FILES="$GITHUB_WORKSPACE/files" PACKAGES="$PACKAGES"
          echo "===== 产物 ====="
          ls -lh bin/targets/mediatek/filogic/

      # 不再手工拆 FIT：直接把改好的 dtb 放进 build_dir，让 ImageBuilder 自己重打镜像，
      # hash / load 地址 / 压缩方式 / metadata 全部由官方规则处理（dumpimage 在该版本无法提取子镜像）
      - name: Repack two itb (patch dtb + make image)
        run: |
          cd "$IB_DIR"
          PACKAGES="$PKGS_BASE $GITHUB_WORKSPACE/pkgs/meow.apk $GITHUB_WORKSPACE/pkgs/luci-app-meow.apk"
          DTB=$(find build_dir -name "image-mt7986a-netcore-n60-pro.dtb" | head -1)
          if [ -z "$DTB" ]; then
            echo "build_dir 里没有 dtb，先跑一次 make image 生成"
            make image PROFILE="$PROFILE" FILES="$GITHUB_WORKSPACE/files" PACKAGES="$PACKAGES"
            DTB=$(find build_dir -name "image-mt7986a-netcore-n60-pro.dtb" | head -1)
          fi
          [ -n "$DTB" ] || { echo "ERROR: build_dir 里找不到 dtb"; find build_dir -name "*.dtb" | head; exit 1; }
          echo "dtb = $DTB"
          cp -f "$DTB" dtb.orig
          dtc -I dtb -O dts dtb.orig -o dtb.orig.dts
          grep -A3 'label = "ubi"' dtb.orig.dts

          for PAIR in "506m 0x0580000 0x1fa80000" "490m 0x0580000 0x1ea00000"; do
            set -- $PAIR
            NAME="$1"
            OFF="$2"
            SIZE="$3"
            # 不依赖 label/reg 先后顺序：先定位 label = "ubi" 的行，再在附近找 reg
            awk -v off="$OFF" -v size="$SIZE" '
              { lines[NR] = $0 }
              /label = "ubi";/ { ubi = NR }
              END {
                if (!ubi) { print "ERROR: dts 中找不到 label = ubi" > "/dev/stderr"; exit 1 }
                done = 0
                for (i = ubi - 6; i <= ubi + 6; i++) {
                  if (i in lines && lines[i] ~ /reg = </) {
                    if (!sub(/reg = <0x[0-9a-fA-F]+ 0x[0-9a-fA-F]+>/, "reg = <" off " " size ">", lines[i])) {
                      print "ERROR: ubi reg 格式不认识: " lines[i] > "/dev/stderr"; exit 1
                    }
                    done = 1
                    break
                  }
                }
                if (!done) { print "ERROR: ubi 节点附近找不到 reg" > "/dev/stderr"; exit 1 }
                for (i = 1; i <= NR; i++) print lines[i]
              }
            ' dtb.orig.dts > "patched-$NAME.dts"
            dtc -I dts -O dtb -o "dtb-$NAME.dtb" "patched-$NAME.dts"
            echo "--- dtb-$NAME.dtb ---"
            dtc -I dtb -O dts "dtb-$NAME.dtb" | grep -A3 'label = "ubi"'

            # 断言：dtc 反编译会把前导 0 去掉（0x0580000 -> 0x580000），所以必须按数值比较
            REG=$(dtc -I dtb -O dts "dtb-$NAME.dtb" | grep -A3 'label = "ubi"' | sed -n 's/.*reg = <\([^>]*\)>;.*/\1/p' | head -1)
            echo "ubi reg = <$REG>"
            set -- $REG
            [ $# -ge 2 ] || { echo "ERROR: 解析 dtb 里的 ubi reg 失败"; exit 1; }
            [ "$(( $1 ))" -eq "$(( OFF ))" ] && [ "$(( $2 ))" -eq "$(( SIZE ))" ] \
              || { echo "ERROR: dtb-$NAME 分区不对，期望 <$OFF $SIZE> 实际 <$REG>"; exit 1; }

            cp -f "dtb-$NAME.dtb" "$DTB"
            rm -f bin/targets/mediatek/filogic/*sysupgrade.itb
            make image PROFILE="$PROFILE" FILES="$GITHUB_WORKSPACE/files" PACKAGES="$PACKAGES"
            NEW=$(ls bin/targets/mediatek/filogic/*squashfs-sysupgrade.itb 2>/dev/null | head -1)
            [ -n "$NEW" ] || { echo "ERROR: 没有产出 sysupgrade.itb"; ls -l bin/targets/mediatek/filogic; exit 1; }
            cp -f "$NEW" "itb-$NAME.itb"
            ls -lh "itb-$NAME.itb"

            # 校验 FILES 覆盖是否生效：ImageBuilder 的 TARGET_DIR 在 make image 后仍保留
            TARGET=$(find build_dir -maxdepth 3 -type d -name "root-*" | head -1)
            if [ -n "$TARGET" ] && [ -f "$TARGET/usr/bin/sing-box" ]; then
              IN_SHA=$(sha256sum "$TARGET/usr/bin/sing-box" | cut -d' ' -f1)
              WANT_SHA=$(sha256sum "$GITHUB_WORKSPACE/pkgs/sing-box-bin" | cut -d' ' -f1)
              echo "rootfs sing-box sha256 = $IN_SHA"
              [ "$IN_SHA" = "$WANT_SHA" ] \
                || { echo "ERROR: rootfs 里的 sing-box 不是官方二进制（FILES 覆盖没生效）"; exit 1; }
            else
              echo "WARNING: 找不到 TARGET_DIR（$TARGET），跳过 sing-box 覆盖校验"
            fi
          done

      - name: Verify itb
        run: |
          cd "$IB_DIR"
          for S in 506m 490m; do
            echo "======== itb-$S.itb ========"
            dumpimage -l "itb-$S.itb" | tee "fit-$S.txt"
            grep -q "Flat Device Tree" "fit-$S.txt" || { echo "ERROR: 缺少 dtb"; exit 1; }
            grep -q "Filesystem" "fit-$S.txt" || { echo "ERROR: 缺少 rootfs"; exit 1; }
            FDT_SHA=$(awk '/Image [0-9]+ \(/{img=$0} /Hash value:/{if (img ~ /fdt-1/ && prev ~ /sha1/) {print $3; exit}} {prev=$0}' "fit-$S.txt")
            LOCAL_SHA=$(sha1sum "dtb-$S.dtb" | cut -d' ' -f1)
            echo "fdt sha1 in itb = $FDT_SHA"
            echo "local dtb sha1  = $LOCAL_SHA"
            [ -n "$FDT_SHA" ] && [ "$FDT_SHA" = "$LOCAL_SHA" ] || { echo "ERROR: itb 里的 dtb 不是我们改的那份"; exit 1; }
          done
          H506=$(sha256sum itb-506m.itb | cut -d' ' -f1)
          H490=$(sha256sum itb-490m.itb | cut -d' ' -f1)
          [ "$H506" != "$H490" ] || { echo "ERROR: 两个 itb 完全相同"; exit 1; }
          echo "506M: $H506"
          echo "490M: $H490"

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/506m" "$GITHUB_WORKSPACE/out/490m"
          BASE=immortalwrt-mediatek-filogic-netcore_n60-pro-squashfs-sysupgrade
          cp -f "$IB_DIR/itb-506m.itb" "$GITHUB_WORKSPACE/out/506m/${BASE}-506m.itb"
          cp -f "$IB_DIR/itb-490m.itb" "$GITHUB_WORKSPACE/out/490m/${BASE}-490m.itb"
          ( cd "$GITHUB_WORKSPACE/out/506m" && sha256sum * > sha256sums.txt )
          ( cd "$GITHUB_WORKSPACE/out/490m" && sha256sum * > sha256sums.txt )
          ls -lR "$GITHUB_WORKSPACE/out"

      - name: Upload Firmware To Release (506M)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_506M }}
          name: ImmortalWrt N60 Pro ImageBuilder 506.5MB
          body: |
            Netcore N60 Pro / MT7986A / 512MB SPI NAND
            ubi 分区：${{ env.UBI_506M }}
            默认地址：192.168.12.1
            预装：momo（含中文 LuCI）、meow、easytier（含中文 LuCI）、UPnP（含中文 LuCI）
            内核模块：kmod-mtd-rw、kmod-tun、kmod-dummy、kmod-nft-*
            sing-box：官方 release 二进制（>= 1.12），非 immortalwrt 源内旧版本
            刷机：同分区间可直接 sysupgrade；跨分区必须用目标分区表的内核（recovery）引导后刷，且不要保留配置
          artifacts: out/506m/*
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Firmware To Release (490M)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_490M }}
          name: ImmortalWrt N60 Pro ImageBuilder 490MB
          body: |
            Netcore N60 Pro / MT7986A / 512MB SPI NAND
            ubi 分区：${{ env.UBI_490M }}
            默认地址：192.168.12.1
            预装：momo（含中文 LuCI）、meow、easytier（含中文 LuCI）、UPnP（含中文 LuCI）
            内核模块：kmod-mtd-rw、kmod-tun、kmod-dummy、kmod-nft-*
            sing-box：官方 release 二进制（>= 1.12），非 immortalwrt 源内旧版本
            刷机：同分区间可直接 sysupgrade；跨分区必须用目标分区表的内核（recovery）引导后刷，且不要保留配置
          artifacts: out/490m/*
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
