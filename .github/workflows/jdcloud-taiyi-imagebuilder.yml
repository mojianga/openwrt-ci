name: jdcloud-taiyi-imagebuilder

# 京东云 太乙 RE-CS-07（JDCloud Taiyi / IPQ6018 / 2G RAM / 8G eMMC / 1WAN+3LAN 千兆 / 无 WiFi）
# 基于 ImmortalWrt snapshot ImageBuilder（默认源；该机型在官方 25.12.x 正式版里没有）
# 构建源可切：source=immortalwrt（默认）/ openwrt（官方 snapshot，feed 修复后可切回去）。
#   之前用官方 snapshot 出过 procd 已更新、配套 libubox 没发出来的半同步问题，故默认走 ImmortalWrt。
#
# snapshot 默认什么都不带，所以这里补：
#   1) LuCI 全家桶 + 中文（luci-i18n-base-zh-cn + uci-defaults 设 zh_cn），否则刷完没有 web 界面
#   2) meow（https://github.com/meow-rs/meow-rs，Rust 版 mihomo/Clash Meta 内核）
#      官方直接产出 OpenWrt 包：meow_<ver>-r1_<arch>.apk + luci-app-meow_<ver>-r1_all.apk，
#      内含 /usr/bin/meow、/etc/init.d/meow（procd）、/etc/config/meow、/etc/meow/config.yaml
#      以及 LuCI「服务 → meow」面板（状态/配置编辑/客户端/tproxy 开关）。
#      meow 不提供 apk feed，只能拿 release 里的包；ImageBuilder 会把 packages/ 顶层的 *.apk
#      自动 apk mkndx 成 packages.adb，然后按包名安装（这就是这里把包拷进 packages/ 的原因）。
#      包未签名，所以给 apk add 加 --allow-untrusted。
#      透明代理需要 kmod-nft-socket / kmod-nft-tproxy（默认 tproxy 模式）。
#   3) easytier：release 二进制 noweb 形态（core + cli）+ 上游 luci-app-easytier + 中文 lmo
#   4) kmod-mtd-rw / kmod-tun / kmod-fs-f2fs / mkf2fs 等
#
# 刷机前提：官方 profile 只有 sysupgrade / initramfs、没有 factory，
#   需先刷第三方 U-Boot（uboot-ipq60xx-emmc-jdcloud_re-cs-07.bin，machid 0x8030202，别用 cs-02 的），
#   U-Boot 里先引导 initramfs，再 sysupgrade 写 eMMC。

on:
  workflow_dispatch:
    inputs:
      meow_version:
        description: 'meow-rs tag（留空=latest，例如 v0.28.0）'
        required: false
        default: ''
      easytier_version:
        description: 'EasyTier tag（留空=latest）'
        required: false
        default: ''
      lan_ip:
        description: '默认 LAN IP'
        required: false
        default: '192.168.22.1'
      extra_packages:
        description: '额外 apk 包（空格分隔）'
        required: false
        default: ''
      source:
        description: '构建源：immortalwrt（默认，feed 自洽）/ openwrt（官方 snapshot 修好后可切）'
        required: false
        default: 'immortalwrt'
  # 点 star 触发（只在默认分支生效）
  watch:
    types: [started]
  # 定时触发（cron 只有 UTC，没有时区参数）：每周日 03:00 UTC = 北京 11:00
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 上游源：默认 ImmortalWrt snapshot（feed 自洽、有本机型）；
  # 官方 OpenWrt snapshot 修好后可把 source 填 openwrt 切回去
  IB_SRC: ${{ github.event.inputs.source || 'immortalwrt' }}
  PROFILE: jdcloud_re-cs-07
  PKG_ARCH: aarch64_cortex-a53
  DEVICE_NAME: jdcloud-re-cs-07
  RELEASE_TAG: jdcloud-taiyi-snapshot
  # 点 star / 定时触发时 inputs 为空，这里统一兜底
  LAN_IP: ${{ github.event.inputs.lan_ip || '192.168.22.1' }}
  EXTRA_PKGS: ${{ github.event.inputs.extra_packages }}
  MEOW_TAG_INPUT: ${{ github.event.inputs.meow_version }}
  ET_TAG_INPUT: ${{ github.event.inputs.easytier_version }}
  # LuCI 框架/模块/主题/web 服务 + 中文 + meow（含 LuCI）+ 透明代理与常用 kmod
  PKGS: luci luci-base luci-mod-network luci-mod-system luci-mod-status luci-theme-bootstrap uhttpd uhttpd-mod-ubus rpcd rpcd-mod-luci rpcd-mod-file rpcd-mod-rrdns luci-compat luci-lua-runtime luci-lib-base luci-lib-ip luci-lib-jsonc luci-lib-nixio libubus-lua libuci-lua luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn bash ca-bundle curl firewall4 ip-full meow luci-app-meow kmod-tun kmod-mtd-rw kmod-nft-socket kmod-nft-tproxy kmod-nft-nat kmod-nft-fib kmod-inet-diag kmod-fs-f2fs mkf2fs

jobs:
  build:
    name: ImageBuilder JDCloud RE-CS-07 (snapshot + meow)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 想在公开仓库里只允许特定账号点星触发，就配仓库变量 STAR_ACTOR=<用户名>
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      vars.STAR_ACTOR == '' ||
      github.actor == vars.STAR_ACTOR

    steps:
      - name: Prepare
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install --no-install-recommends \
            zstd unzip jq curl git make file python3 gcc libc6-dev binutils

      # 下载 ImageBuilder + 把 meow / luci-app-meow 的 apk 塞进 packages/（IB 会自动建索引）
      - name: Prepare ImageBuilder (+ meow apk)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$IB_SRC" in
            immortalwrt|ImmortalWrt|IWRT)
              BASE_URL=https://downloads.immortalwrt.org/snapshots
              IB_FILE=immortalwrt-imagebuilder-qualcommax-ipq60xx.Linux-x86_64.tar.zst
              DISTRIB=IMMORTALWRT-SNAPSHOT
              ;;
            *)
              BASE_URL=https://downloads.openwrt.org/snapshots
              IB_FILE=openwrt-imagebuilder-qualcommax-ipq60xx.Linux-x86_64.tar.zst
              DISTRIB=SNAPSHOT
              ;;
          esac
          IB_URL="${BASE_URL}/targets/qualcommax/ipq60xx/${IB_FILE}"
          echo "source = $DISTRIB"
          echo "IB_URL = $IB_URL"

          curl -fL --retry 3 --retry-delay 5 -o ib.tar.zst "$IB_URL"
          tar --zstd -xf ib.tar.zst
          IB=$(ls -d "$PWD"/*imagebuilder-* | head -1)
          [ -d "$IB" ] || { echo "ERROR: 解压后没找到 ImageBuilder 目录"; ls -al; exit 1; }
          echo "IB_DIR=$IB" >> "$GITHUB_ENV"
          BUILDINFO=$(curl -fsSL --retry 3 "${BASE_URL}/targets/qualcommax/ipq60xx/version.buildinfo" | head -1 | tr -d '\r\n' || true)
          echo "OPENWRT_VER=${DISTRIB}(${BUILDINFO:-unknown})" >> "$GITHUB_ENV"
          echo "ImageBuilder = $IB ($DISTRIB build ${BUILDINFO:-unknown})"

          cd "$IB"
          # ImageBuilder 默认不产 initramfs 镜像（tarball 里的 .config 没开 INITRAMFS），
          # 而首次刷机要靠它引导，所以显式打开；万一没开成功，verify 步骤只告警不失败。
          if [ -f .config ]; then
            grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config \
              || echo 'CONFIG_TARGET_ROOTFS_INITRAMFS=y' >> .config
          fi

          # meow 未提供 feed，只能从 release 取包；按资产名匹配，避免 -r1/-r2 变动踩坑
          TAG="${MEOW_TAG_INPUT:-}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   https://api.github.com/repos/meow-rs/meow-rs/releases/latest | jq -r '.tag_name')
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "ERROR: 取 meow 版本失败"; exit 1; }
          echo "meow tag = $TAG"

          ASSETS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/meow-rs/meow-rs/releases/tags/${TAG}" \
                   | jq -r '.assets[].browser_download_url')
          MEOW_APK=$(printf '%s\n' "$ASSETS" | grep -E "/meow_[^/]*_${PKG_ARCH}\.apk$" | head -1)
          LUCI_APK=$(printf '%s\n' "$ASSETS" | grep -E "/luci-app-meow_[^/]*_all\.apk$" | head -1)
          [ -n "$MEOW_APK" ] || { echo "ERROR: release 里没有 meow 的 ${PKG_ARCH} apk"; printf '%s\n' "$ASSETS"; exit 1; }
          [ -n "$LUCI_APK" ] || { echo "ERROR: release 里没有 luci-app-meow 的 apk"; printf '%s\n' "$ASSETS"; exit 1; }

          # 注意必须放在 packages/ 顶层：IB 的 package_index 只 glob packages/*.apk（不递归）
          mkdir -p packages
          MEOW_FILE=$(basename "$MEOW_APK")
          LUCI_FILE=$(basename "$LUCI_APK")
          curl -fL --retry 3 -o "packages/$MEOW_FILE" "$MEOW_APK"
          curl -fL --retry 3 -o "packages/$LUCI_FILE" "$LUCI_APK"

          # apk 会按 <name>-<version>.apk 去找包文件（OpenWrt 官方仓库就是这个命名），
          # 上游 release 却是 <name>_<ver>_<arch>.apk，不改名会报
          #   ERROR: meow-0.28.0-r1: package mentioned in index not found
          rename_apk() {  # $1=文件名 $2=架构后缀
            f="$1"; a="$2"
            case "$f" in
              *_*_"${a}".apk)
                n="${f%%_*}"
                v="${f#*_}"
                v="${v%_"${a}".apk}"
                mv -f "packages/$f" "packages/${n}-${v}.apk"
                echo "renamed: $f -> ${n}-${v}.apk"
                ;;
              *)
                echo "keep: $f（已是 <name>-<version>.apk 形式）"
                ;;
            esac
          }
          rename_apk "$MEOW_FILE" "$PKG_ARCH"
          rename_apk "$LUCI_FILE" "all"

          ls -lh packages/
          sha256sum packages/*.apk
          echo "MEOW_TAG=$TAG" >> "$GITHUB_ENV"
          echo "MEOW_PKG=$(ls packages/meow-*.apk 2>/dev/null | head -1 | xargs -r basename)" >> "$GITHUB_ENV"

      # 取 easytier 的 aarch64 二进制，连同 luci-app-easytier 与中文 lmo 一起铺进 FILES
      - name: Fetch easytier & build FILES overlay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pkgs/et files/usr/bin files/etc/uci-defaults

          # ---------- easytier（noweb：只要 core + cli） ----------
          ET="${ET_TAG_INPUT:-}"
          if [ -z "$ET" ]; then
            ET=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                  https://api.github.com/repos/EasyTier/EasyTier/releases/latest | jq -r '.tag_name')
          fi
          [ -n "$ET" ] && [ "$ET" != "null" ] || { echo "ERROR: 取 EasyTier 版本失败"; exit 1; }
          curl -fL --retry 3 -o pkgs/easytier.zip \
            "https://github.com/EasyTier/EasyTier/releases/download/${ET}/easytier-linux-aarch64-${ET}.zip"
          unzip -o -j pkgs/easytier.zip -d pkgs/et > /dev/null
          for B in easytier-core easytier-cli; do
            [ -f "pkgs/et/$B" ] || { echo "ERROR: zip 里没有 $B"; exit 1; }
            cp -a "pkgs/et/$B" files/usr/bin/
          done
          echo "EASYTIER_TAG=$ET" >> "$GITHUB_ENV"

          # ---------- luci-app-easytier（luasrc -> /usr/lib/lua/luci，root -> /） ----------
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git et-src
          mkdir -p files/usr/lib/lua/luci
          cp -a et-src/luci-app-easytier/luasrc/. files/usr/lib/lua/luci/
          cp -a et-src/luci-app-easytier/root/. files/
          chmod -R 0755 files/etc/init.d files/usr/bin 2>/dev/null || true

          # ---------- 中文 lmo（po2lmo 必须走上游 Makefile，否则 sfh_hash 未定义） ----------
          if git clone --depth 1 --filter=blob:none --sparse https://github.com/openwrt/luci.git luci-src \
             && git -C luci-src sparse-checkout set modules/luci-base/src \
             && make -C luci-src/modules/luci-base/src po2lmo \
             && mkdir -p files/usr/lib/lua/luci/i18n \
             && luci-src/modules/luci-base/src/po2lmo \
                  et-src/luci-app-easytier/po/zh_Hans/easytier.po \
                  files/usr/lib/lua/luci/i18n/easytier.zh-cn.lmo; then
            echo "easytier 中文 lmo OK"
          else
            echo "WARNING: easytier 中文 lmo 生成失败，界面只有英文（不影响构建）"
          fi

          # ---------- 默认值（uci-defaults 在 network 启动前执行，直接生效） ----------
          printf '%s\n' '#!/bin/sh' \
            "uci -q set network.lan.ipaddr='${LAN_IP}'" \
            "uci -q set network.lan.netmask='255.255.255.0'" \
            "uci -q set system.@system[0].hostname='Taiyi'" \
            'uci -q commit network' 'uci -q commit system' 'exit 0' \
            > files/etc/uci-defaults/98-taiyi-net

          printf '%s\n' '#!/bin/sh' \
            "uci -q set luci.main.lang='zh_cn'" \
            'uci -q commit luci' 'exit 0' \
            > files/etc/uci-defaults/99-taiyi-lang

          chmod 0755 files/etc/uci-defaults/*
          echo "LAN IP = $LAN_IP, easytier = $ET"
          find files -type f | head -20

      # 只跑一次，不重试：失败就把原因和人话建议打出来
      - name: Make image
        run: |
          set -euo pipefail
          cd "$IB_DIR"
          PACKAGES="$(printf '%s %s' "$PKGS" "${EXTRA_PKGS:-}")"
          echo "PACKAGES=$PACKAGES"

          # meow 的包未签名，给 apk add 补 --allow-untrusted（IB 若已带，这一步是 no-op）
          sed -i 's|[$](APK) add --arch|$(APK) add --allow-untrusted --arch|' Makefile
          grep -q "allow-untrusted" Makefile || echo "WARNING: 没匹配到 apk add，靠 packages.adb 索引"

          if make image PROFILE="$PROFILE" FILES="$GITHUB_WORKSPACE/files" PACKAGES="$PACKAGES" > build.log 2>&1; then
            echo "=== BUILD OK ==="
          else
            tail -40 build.log
            echo "---------- apk/opkg 报错 ----------"
            grep -E "^(ERROR|WARNING)" build.log | head -10 || true
            echo "---------- 缺失的包 ----------"
            { grep -oE "Unknown package '[^']+'" build.log | sed -E "s/.*'(.*)'/\1/" || true
              grep -oE "[A-Za-z0-9._+-]+ \(no such package\)" build.log | sed 's/ (no such package)//' || true
            } | sort -u | sed 's/^/  缺: /'
            echo "----------------------------------------"
            echo "排查提示："
            echo "  - 缺 libubox20xxxxxx / libblobmsg-json20xxxxxx：上游 feed 正在重建，过几小时重跑"
            echo "  - 报 'package mentioned in index not found'：packages/ 里的 .apk 文件名必须是 <name>-<version>.apk"
            echo "  - 其他：看上面 apk 报错原文"
            exit 1
          fi

          echo "PKGS_FINAL=$PACKAGES" >> "$GITHUB_ENV"
          ls -lh bin/targets/qualcommax/ipq60xx/

      # 校验 rootfs 里该有的东西都在，然后把产物收进 out/
      - name: Verify & collect
        run: |
          set -euo pipefail
          cd "$IB_DIR"
          IMG=bin/targets/qualcommax/ipq60xx
          T=$(find build_dir -maxdepth 3 -type d -name "root-*" | head -1)
          [ -n "$T" ] || { echo "ERROR: 找不到 TARGET_DIR"; exit 1; }

          # 产物前缀随源变化（openwrt- / immortalwrt-），一律用 glob 取
          SYS=$(ls "$IMG"/*squashfs-sysupgrade.bin 2>/dev/null | head -1)
          [ -n "$SYS" ] || { echo "ERROR: 没有产出 squashfs-sysupgrade.bin"; ls -lh "$IMG"; exit 1; }
          echo "  OK   $(basename "$SYS") ($(du -h "$SYS" | cut -f1))"

          # initramfs 只告警（没开 INITRAMFS 时确实不产）
          INIT=$(ls "$IMG"/*initramfs-uImage.itb 2>/dev/null | head -1)
          if [ -n "$INIT" ]; then
            echo "  OK   $(basename "$INIT")"
          else
            echo "  WARN 没有 initramfs 镜像，首次刷机请用同一 snapshot 的 initramfs 引导"
          fi

          fail=0
          need() { [ -e "$T$1" ] && echo "  OK   $1" || { echo "  MISS $1"; fail=1; }; }
          # 包按 apk 数据库校验（路径无关，比猜文件可靠）
          pkg() {
            [ -f "$T/lib/apk/db/installed" ] || { echo "  WARN 无 apk db，跳过 $1"; return 0; }
            grep -qx "P:$1" "$T/lib/apk/db/installed" && echo "  OK   pkg:$1" || { echo "  MISS pkg:$1"; fail=1; }
          }

          for P in meow luci-app-meow luci-base luci-i18n-base-zh-cn kmod-tun kmod-mtd-rw kmod-nft-tproxy kmod-nft-socket; do pkg "$P"; done

          # meow 包的文件布局（init/config/默认 yaml/gateway 脚本）+ easytier 与 uci-defaults
          for F in /usr/bin/meow /etc/init.d/meow /etc/config/meow /etc/meow/config.yaml \
                   /usr/share/meow/gateway.sh \
                   /usr/bin/easytier-core /usr/bin/easytier-cli \
                   /usr/lib/lua/luci/controller/easytier.lua \
                   /etc/uci-defaults/99-taiyi-lang; do need "$F"; done
          # easytier 的 init 脚本属 luci-app-easytier 的 root/，不同版本可能叫法不同，只告警
          if [ -e "$T/etc/init.d/easytier" ]; then
            echo "  OK   /etc/init.d/easytier"
          else
            echo "  WARN 没有 /etc/init.d/easytier（LuCI 里用不了启停按钮？）"
          fi
          # LuCI 菜单（JS app 在 menu.d，老式 Lua app 在 controller），路径随版本变，只告警
          MEOW_MENU=""
          for M in /usr/share/luci/menu.d/luci-app-meow.json /usr/share/luci/menu.d/meow.json \
                   /usr/lib/lua/luci/controller/meow.lua; do
            if [ -e "$T$M" ]; then MEOW_MENU=$M; break; fi
          done
          if [ -n "$MEOW_MENU" ]; then
            echo "  OK   LuCI 菜单 -> $MEOW_MENU"
          else
            echo "  WARN 没找到 luci-app-meow 的菜单文件（包已装，可能改了路径）"
          fi

          # meow 必须是 aarch64（包架构选错的话这里能看出来）
          if file -b "$T/usr/bin/meow" 2>/dev/null | grep -q aarch64; then
            echo "  OK   meow 架构 aarch64"
          else
            echo "  MISS meow 不是 aarch64 二进制"; file "$T/usr/bin/meow" || true; fail=1
          fi

          # rpcd 在 /sbin（个别版本 /usr/sbin），两个都认
          RPCD=""
          for C in /sbin/rpcd /usr/sbin/rpcd; do
            if [ -x "$T$C" ]; then RPCD=$C; break; fi
          done
          if [ -n "$RPCD" ]; then echo "  OK   $RPCD"; else echo "  MISS rpcd"; fail=1; fi

          # 内核模块：TUN、mtd-rw、透明代理两个 kmod 是硬需求
          KOS=$(find "$T/lib/modules" \( -name 'tun.ko*' -o -name 'mtd-rw.ko*' -o -name 'nft_tproxy.ko*' -o -name 'nft_socket.ko*' \) 2>/dev/null | sort)
          echo "$KOS" | sed "s|^$T|  OK  |"
          KO_COUNT=$(printf '%s\n' "$KOS" | grep -c '\.ko' || true)
          [ "$KO_COUNT" -ge 4 ] || { echo "  MISS tun/mtd-rw/nft_tproxy/nft_socket 内核模块"; fail=1; }

          # easytier 必须 noweb 形态；中文 lmo 可选
          if [ -e "$T/usr/bin/easytier-web" ] || [ -e "$T/usr/bin/easytier-web-embed" ]; then
            echo "  MISS 出现 easytier-web，应为 noweb 形态"; fail=1
          else
            echo "  OK   easytier noweb 形态"
          fi
          [ -s "$T/usr/lib/lua/luci/i18n/easytier.zh-cn.lmo" ] \
            && echo "  OK   easytier.zh-cn.lmo" \
            || echo "  WARN 缺 easytier 中文 lmo（只影响翻译）"

          [ "$fail" -eq 0 ] || { echo "ERROR: rootfs 校验失败"; exit 1; }

          # ---------- 收集产物 ----------
          OUT="$GITHUB_WORKSPACE/out"; rm -rf "$OUT"; mkdir -p "$OUT"
          cp -f "$SYS" "$OUT/"
          [ -n "$INIT" ] && cp -f "$INIT" "$OUT/" || true
          {
            echo "device  : JDCloud ${DEVICE_NAME} (${PROFILE})"
            echo "openwrt : ${OPENWRT_VER}"
            echo "meow    : ${MEOW_TAG}  (${MEOW_PKG})"
            echo "easytier: ${EASYTIER_TAG}"
            echo "lan ip  : ${LAN_IP}"
            echo "build   : $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "packages: ${PKGS_FINAL}"
          } > "$OUT/build-info.txt"
          ( cd "$OUT" && sha256sum * > sha256sums.txt && cat build-info.txt && ls -lh )

      - name: Upload Firmware To Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: JDCloud Taiyi RE-CS-07 (LuCI + meow + easytier)
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: out/*
          body: |
            JDCloud 太乙 RE-CS-07 / IPQ6018 / 2G RAM / 8G eMMC / 1WAN+3LAN 千兆 / 无 WiFi
            构建源：${{ env.OPENWRT_VER }}（profile `jdcloud_re-cs-07`）
            默认 LAN：${{ env.LAN_IP }}，主机名 Taiyi，LuCI 默认中文

            预装：
            - LuCI 完整界面（luci-base + mod-network/system/status + bootstrap 主题 + uhttpd + rpcd）
            - **meow** ${{ env.MEOW_TAG }}（Rust 版 mihomo/Clash Meta 内核）+ luci-app-meow：
              LuCI「服务 → meow」里配置（Overview / Panel / Configuration / Clients / Settings / Log）
            - EasyTier ${{ env.EASYTIER_TAG }}（noweb：core + cli）+ luci-app-easytier + 中文翻译
            - kmod-tun / kmod-mtd-rw / kmod-nft-tproxy / kmod-nft-socket / kmod-nft-nat / kmod-nft-fib / kmod-inet-diag

            meow 使用：
            1. 打开 http://${{ env.LAN_IP }} → 服务 → meow
            2. 在「Configuration」里粘贴 Clash/mihomo 格式的 YAML（保存前会用 `meow -t` 校验）
            3. 到「Settings」勾启用，打开透明代理（默认 tproxy；redirect 为 TCP-only）
            4. 「Panel」页是 meow 自带 Web 面板（端口/密钥在 Settings 里改）
            注意：meow 默认不启动；配置文件是 /etc/meow/config.yaml，UCI 在 /etc/config/meow

            easytier：服务 → EasyTier 里配置启用（easytier-core 已就位）。
            kmod-mtd-rw：`insmod mtd-rw i_want_a_brick=1`（临时解除写保护，机器不再「防砖」）。

            刷机：
            1. 需第三方 U-Boot（uboot-ipq60xx-emmc-jdcloud_re-cs-07.bin，machid 0x8030202；不要用 cs-02 的）
            2. 官方 profile 没有 factory：先在 U-Boot 里引导 initramfs-uImage.itb
               （若没有 initramfs 附件，用 downloads.openwrt.org 同 snapshot 的 initramfs 引导，
                它只负责把系统跑起来，写完 sysupgrade 后就被覆盖）
            3. 进系统后 `sysupgrade -n <squashfs-sysupgrade.bin>` 写 eMMC（首次刷写不要保留配置）

            建议关掉硬件卸载（meow/TUN/easytier 都在用户态，offload 帮不上忙还可能绕过规则）：
            ```
            uci set network.@device[0].packet_steering='0'
            uci set firewall.@defaults[0].flow_offloading='0'
            uci set firewall.@defaults[0].flow_offloading_hw='0'
            uci commit && /etc/init.d/network reload && /etc/init.d/firewall restart
            ```

            注意：meow 的包未签名（构建时用 --allow-untrusted 装进去），后续升级请用
            `apk add --allow-untrusted ./meow_<ver>-r1_<arch>.apk`；
            snapshot 是滚动版本，社区反馈主线固件曾缺 f2fs 导致 overlay 不持久化，
            刷完请先验证「改配置 → 重启 → 配置是否保留」。
