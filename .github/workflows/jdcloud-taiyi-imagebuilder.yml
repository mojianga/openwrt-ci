name: jdcloud-taiyi-imagebuilder

# 京东云 太乙 RE-CS-07（JDCloud Taiyi / IPQ6018 / 2G RAM / 8G eMMC / 1WAN+3LAN 千兆 / 无 WiFi）
# 基于 OpenWrt 官方 snapshot ImageBuilder（该机型只在 snapshot 里，25.12.x 正式版没有）
#
# snapshot 默认什么都不带，所以这里补：
#   1) LuCI 全家桶 + 中文（luci-i18n-base-zh-cn + uci-defaults 设 zh_cn），否则刷完没有 web 界面
#   2) momo（+ luci-app-momo + 中文包）：从 momomomo.pages.dev 的 SNAPSHOT 源装，
#      它负责跑 sing-box、下发 TUN/TPROXY 规则；sing-box 因此走 feed 里的包（提供 init/config、满足依赖），
#      只用 FILES 把 /usr/bin/sing-box 换成官方 linux-arm64-musl 二进制
#      —— 默认的 linux-arm64.tar.gz 是 glibc 动态链接，刷进 musl 固件必然「无法执行」
#   3) easytier：release 二进制 noweb 形态（core + cli）+ 上游 luci-app-easytier + 中文 lmo
#   4) kmod-mtd-rw / kmod-tun，以及 momo 的硬依赖 kmod-inet-diag / kmod-nft-tproxy / kmod-nft-socket
#
# 刷机前提：官方 profile 只有 sysupgrade / initramfs、没有 factory，
#   需先刷第三方 U-Boot（uboot-ipq60xx-emmc-jdcloud_re-cs-07.bin，machid 0x8030202，别用 cs-02 的），
#   U-Boot 里先引导 initramfs，再 sysupgrade 写 eMMC。

on:
  workflow_dispatch:
    inputs:
      singbox_version:
        description: 'sing-box tag（留空=latest，需 >= 1.12，momo 要求）'
        required: false
        default: ''
      easytier_version:
        description: 'EasyTier tag（留空=latest）'
        required: false
        default: ''
      lan_ip:
        description: '默认 LAN IP'
        required: false
        default: '192.168.22.1'
      extra_packages:
        description: '额外 apk 包（空格分隔，不存在的会自动丢弃）'
        required: false
        default: ''
  # 点 star 触发（只在默认分支生效）
  watch:
    types: [started]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  IB_URL: https://downloads.openwrt.org/snapshots/targets/qualcommax/ipq60xx/openwrt-imagebuilder-qualcommax-ipq60xx.Linux-x86_64.tar.zst
  VER_URL: https://downloads.openwrt.org/snapshots/targets/qualcommax/ipq60xx/version.buildinfo
  MOMO_REPO: https://momomomo.pages.dev/SNAPSHOT/aarch64_cortex-a53/momo
  MOMO_KEY: https://momomomo.pages.dev/public-key.pem
  PROFILE: jdcloud_re-cs-07
  DEVICE_NAME: jdcloud-re-cs-07
  RELEASE_TAG: jdcloud-taiyi-snapshot
  # 点 star 触发时 inputs 为空，这里统一兜底
  LAN_IP: ${{ github.event.inputs.lan_ip || '192.168.22.1' }}
  EXTRA_PKGS: ${{ github.event.inputs.extra_packages }}
  SB_TAG_INPUT: ${{ github.event.inputs.singbox_version }}
  ET_TAG_INPUT: ${{ github.event.inputs.easytier_version }}
  # 一次列全：LuCI 框架/模块/主题/web 服务、中文、momo 及其 kmod 依赖、可用工具
  PKGS: luci luci-base luci-mod-network luci-mod-system luci-mod-status luci-theme-bootstrap uhttpd uhttpd-mod-ubus rpcd rpcd-mod-luci rpcd-mod-file rpcd-mod-rrdns luci-compat luci-lua-runtime luci-lib-base luci-lib-ip luci-lib-jsonc luci-lib-nixio libubus-lua libuci-lua luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn bash ca-bundle curl firewall4 ip-full sing-box momo luci-app-momo luci-i18n-momo-zh-cn kmod-tun kmod-mtd-rw kmod-inet-diag kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-nft-fib kmod-dummy kmod-fs-f2fs mkf2fs

jobs:
  build:
    name: ImageBuilder JDCloud RE-CS-07 (snapshot + momo)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 想在公开仓库里只允许特定账号点星触发，就配仓库变量 STAR_ACTOR=<用户名>
    if: github.event_name == 'workflow_dispatch' || vars.STAR_ACTOR == '' || github.actor == vars.STAR_ACTOR

    steps:
      - name: Prepare
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install --no-install-recommends \
            zstd unzip jq curl git make file python3 gcc libc6-dev binutils

      # 下载 ImageBuilder + 挂 momo 的 apk 源 + 放开未签名包，一次做完
      - name: Prepare ImageBuilder (+ momo repo)
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o ib.tar.zst "$IB_URL"
          tar --zstd -xf ib.tar.zst
          IB=$(ls -d "$PWD"/openwrt-imagebuilder-* | head -1)
          [ -d "$IB" ] || { echo "ERROR: 解压后没找到 ImageBuilder 目录"; ls -al; exit 1; }
          echo "IB_DIR=$IB" >> "$GITHUB_ENV"
          echo "OPENWRT_VER=$(curl -fsSL --retry 3 "$VER_URL" | head -1 | tr -d '\r\n' || echo unknown)" >> "$GITHUB_ENV"
          echo "ImageBuilder = $IB"

          cd "$IB"
          # ImageBuilder 默认不产 initramfs 镜像（tarball 里的 .config 没开 INITRAMFS），
          # 而首次刷机要靠它引导，所以这里显式打开；万一没开成功，verify 步骤只告警不失败。
          if [ -f .config ]; then
            grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config \
              || echo 'CONFIG_TARGET_ROOTFS_INITRAMFS=y' >> .config
            echo "initramfs 镜像: $(grep -c '^CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config) 处开启"
          fi

          # apk 3 的仓库条目要指向索引文件本身（写目录会被拼成 <dir>/<arch>/APKINDEX.tar.gz）
          if [ -f repositories ]; then
            echo "$MOMO_REPO/packages.adb" >> repositories
            echo "REPO_FILE=repositories" >> "$GITHUB_ENV"
          elif [ -f repositories.conf ]; then
            echo "src/gz momo $MOMO_REPO" >> repositories.conf
            echo "REPO_FILE=repositories.conf" >> "$GITHUB_ENV"
          else
            echo "ERROR: 找不到 repositories / repositories.conf"; ls -a; exit 1
          fi

          curl -fsSL --retry 3 -o /dev/null "$MOMO_REPO/packages.adb" \
            || { echo "ERROR: momo SNAPSHOT 源不可用（分支没构建 / 架构无包）"; exit 1; }
          mkdir -p keys
          curl -fsSL --retry 3 "$MOMO_KEY" -o keys/momo.pem

          # momo 的包与官方签名体系不同，给 apk add 加 --allow-untrusted（公钥仍在 keys/ 里）
          sed -i 's|[$](APK) add --arch|$(APK) add --allow-untrusted --arch|' Makefile
          grep -q "allow-untrusted" Makefile \
            || { echo "WARNING: Makefile 里没匹配到 apk add，靠 keys/momo.pem 验签"; true; }

      # 取 sing-box / easytier 的 aarch64 二进制，连同 luci-app-easytier 与中文 lmo 一起铺进 FILES
      - name: Fetch binaries & build FILES overlay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pkgs/et files/usr/bin files/etc/uci-defaults

          # ---------- sing-box（必须 musl） ----------
          TAG="${SB_TAG_INPUT:-}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "ERROR: 取 sing-box 版本失败"; exit 1; }
          VER=${TAG#v}
          # momo 要求 sing-box >= 1.12；sort -V 避免 1.9 / 2.0 被判错
          [ "$(printf '%s\n%s\n' "$VER" 1.12.0 | sort -V | head -1)" = "1.12.0" ] \
            || { echo "ERROR: sing-box $VER < 1.12，momo 不兼容"; exit 1; }
          curl -fL --retry 3 -o pkgs/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VER}-linux-arm64-musl.tar.gz"
          tar -xzf pkgs/sing-box.tar.gz -C pkgs
          install -m 0755 "$(find pkgs -type f -name sing-box | head -1)" pkgs/sing-box-bin
          case "$(file -b pkgs/sing-box-bin)" in
            *aarch64*|*ARM*) echo "sing-box 架构 OK" ;;
            *) echo "ERROR: sing-box 不是 aarch64"; exit 1 ;;
          esac
          # 拒绝 glibc 动态链接（这才是它在 musl 固件上跑不起来的根因）
          readelf -l pkgs/sing-box-bin > /tmp/sb.elf 2>/dev/null || true
          if grep -q interpreter /tmp/sb.elf; then
            sed -n 's/.*interpreter: \(.*\)\]/\1/p' /tmp/sb.elf | head -1 | grep -q musl \
              || { echo "ERROR: sing-box 动态链接到非 musl，刷机后无法执行"; grep interpreter /tmp/sb.elf; exit 1; }
          fi
          # init 脚本 / uci 配置由 feed 的 sing-box 包提供，运行由 momo 管，这里只覆盖二进制
          install -D -m 0755 pkgs/sing-box-bin files/usr/bin/sing-box
          echo "SINGBOX_TAG=$TAG" >> "$GITHUB_ENV"

          # ---------- easytier（noweb：只要 core + cli） ----------
          ET="${ET_TAG_INPUT:-}"
          if [ -z "$ET" ]; then
            ET=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                  https://api.github.com/repos/EasyTier/EasyTier/releases/latest | jq -r '.tag_name')
          fi
          [ -n "$ET" ] && [ "$ET" != "null" ] || { echo "ERROR: 取 EasyTier 版本失败"; exit 1; }
          curl -fL --retry 3 -o pkgs/easytier.zip \
            "https://github.com/EasyTier/EasyTier/releases/download/${ET}/easytier-linux-aarch64-${ET}.zip"
          unzip -o -j pkgs/easytier.zip -d pkgs/et > /dev/null
          for B in easytier-core easytier-cli; do
            [ -f "pkgs/et/$B" ] || { echo "ERROR: zip 里没有 $B"; exit 1; }
            cp -a "pkgs/et/$B" files/usr/bin/
          done
          echo "EASYTIER_TAG=$ET" >> "$GITHUB_ENV"

          # ---------- luci-app-easytier（luasrc -> /usr/lib/lua/luci，root -> /） ----------
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git et-src
          mkdir -p files/usr/lib/lua/luci
          cp -a et-src/luci-app-easytier/luasrc/. files/usr/lib/lua/luci/
          cp -a et-src/luci-app-easytier/root/. files/
          chmod -R 0755 files/etc/init.d files/usr/bin 2>/dev/null || true

          # ---------- 中文 lmo（po2lmo 必须走上游 Makefile，否则 sfh_hash 未定义） ----------
          if git clone --depth 1 --filter=blob:none --sparse https://github.com/openwrt/luci.git luci-src \
             && git -C luci-src sparse-checkout set modules/luci-base/src \
             && make -C luci-src/modules/luci-base/src po2lmo \
             && mkdir -p files/usr/lib/lua/luci/i18n \
             && luci-src/modules/luci-base/src/po2lmo \
                  et-src/luci-app-easytier/po/zh_Hans/easytier.po \
                  files/usr/lib/lua/luci/i18n/easytier.zh-cn.lmo; then
            echo "easytier 中文 lmo OK"
          else
            echo "WARNING: easytier 中文 lmo 生成失败，界面只有英文（不影响构建）"
          fi

          # ---------- 默认值（uci-defaults 在 network 启动前执行，直接生效） ----------
          printf '%s\n' '#!/bin/sh' \
            "uci -q set network.lan.ipaddr='${LAN_IP}'" \
            "uci -q set network.lan.netmask='255.255.255.0'" \
            "uci -q set system.@system[0].hostname='Taiyi'" \
            'uci -q commit network' 'uci -q commit system' 'exit 0' \
            > files/etc/uci-defaults/98-taiyi-net

          printf '%s\n' '#!/bin/sh' \
            "uci -q set luci.main.lang='zh_cn'" \
            'uci -q commit luci' 'exit 0' \
            > files/etc/uci-defaults/99-taiyi-lang

          # sing-box 由 momo 拉起，关掉 feed 包自带的服务，免得两个进程抢同一个 TUN
          printf '%s\n' '#!/bin/sh' \
            '[ -x /etc/init.d/sing-box ] && /etc/init.d/sing-box disable' \
            'exit 0' \
            > files/etc/uci-defaults/97-taiyi-singbox

          chmod 0755 files/etc/uci-defaults/*
          echo "LAN IP = $LAN_IP, sing-box = $TAG, easytier = $ET"
          find files -type f | head -20

      # snapshot 的包名会变：构建失败时从日志里认出「不存在」的包，剔掉重试
      - name: Make image
        run: |
          set -uo pipefail
          cd "$IB_DIR"
          printf '%s\n' $PKGS ${EXTRA_PKGS:-} | tr -s '[:space:]' '\n' | grep -v '^$' | sort -u > pkgs.txt

          for attempt in 1 2 3; do
            ALL=$(tr '\n' ' ' < pkgs.txt)
            echo "=== make image #$attempt（$(wc -l < pkgs.txt) 个包）==="
            if make image PROFILE="$PROFILE" FILES="$GITHUB_WORKSPACE/files" PACKAGES="$ALL" > build.log 2>&1; then
              echo "=== BUILD OK ==="
              break
            fi
            tail -30 build.log

            # opkg: Unknown package 'foo' / apk: foo (no such package)
            { grep -oE "Unknown package '[^']+'" build.log | sed -E "s/.*'(.*)'/\1/" || true
              grep -oE "[A-Za-z0-9._+-]+ \(no such package\)" build.log | sed 's/ (no such package)//' || true
            } | sort -u > missing.txt
            [ -s missing.txt ] || { echo "ERROR: 构建失败，且没有可剔除的包名（见上面日志）"; exit 1; }
            [ "$attempt" -lt 3 ] || { echo "ERROR: 重试 3 次仍失败"; exit 1; }

            echo "--- 源里不存在，丢弃后重试：$(tr '\n' ' ' < missing.txt)"
            grep -vxF -f missing.txt pkgs.txt > pkgs.new || true
            [ -s pkgs.new ] || { echo "ERROR: 包列表被清空"; exit 1; }
            mv pkgs.new pkgs.txt
          done

          echo "PKGS_FINAL=$(tr '\n' ' ' < pkgs.txt)" >> "$GITHUB_ENV"
          ls -lh bin/targets/qualcommax/ipq60xx/

      # 校验 rootfs 里该有的东西都在，然后把产物收进 out/
      - name: Verify & collect
        run: |
          set -euo pipefail
          cd "$IB_DIR"
          BASE=openwrt-qualcommax-ipq60xx-${PROFILE}
          IMG=bin/targets/qualcommax/ipq60xx
          T=$(find build_dir -maxdepth 3 -type d -name "root-*" | head -1)
          [ -n "$T" ] || { echo "ERROR: 找不到 TARGET_DIR"; exit 1; }

          # sysupgrade 必须有；initramfs 只告警（没开 INITRAMFS 时确实不产）
          [ -s "$IMG/${BASE}-squashfs-sysupgrade.bin" ] \
            || { echo "ERROR: 没有产出 squashfs-sysupgrade.bin"; ls -lh "$IMG"; exit 1; }
          echo "  OK   $(basename "$IMG/${BASE}-squashfs-sysupgrade.bin") ($(du -h "$IMG/${BASE}-squashfs-sysupgrade.bin" | cut -f1))"
          if [ -s "$IMG/${BASE}-initramfs-uImage.itb" ]; then
            echo "  OK   $(basename "$IMG/${BASE}-initramfs-uImage.itb")"
          else
            echo "  WARN 没有 initramfs 镜像，首次刷机请用官方 downloads 里的 initramfs 引导"
          fi

          fail=0
          need() { [ -e "$T$1" ] && echo "  OK   $1" || { echo "  MISS $1"; fail=1; }; }
          # 包按 apk 数据库校验（路径无关，比猜文件可靠）
          pkg() {
            [ -f "$T/lib/apk/db/installed" ] || { echo "  WARN 无 apk db，跳过 $1"; return 0; }
            grep -qx "P:$1" "$T/lib/apk/db/installed" && echo "  OK   pkg:$1" || { echo "  MISS pkg:$1"; fail=1; }
          }

          for P in sing-box momo luci-app-momo luci-base luci-i18n-base-zh-cn kmod-tun kmod-mtd-rw kmod-nft-tproxy; do pkg "$P"; done
          for F in /usr/bin/sing-box /usr/bin/easytier-core /usr/bin/easytier-cli \
                   /etc/init.d/momo /usr/sbin/uhttpd /www/luci-static/bootstrap/cascade.css \
                   /usr/lib/lua/luci/controller/easytier.lua /etc/uci-defaults/99-taiyi-lang; do need "$F"; done

          # rpcd 在 /sbin（个别版本 /usr/sbin），两个都认
          RPCD=""
          for C in /sbin/rpcd /usr/sbin/rpcd; do
            if [ -x "$T$C" ]; then RPCD=$C; break; fi
          done
          if [ -n "$RPCD" ]; then echo "  OK   $RPCD"; else echo "  MISS rpcd"; fail=1; fi

          # 内核模块：TUN 与 mtd-rw 是硬需求
          KOS=$(find "$T/lib/modules" \( -name 'tun.ko*' -o -name 'mtd-rw.ko*' \) 2>/dev/null | sort)
          echo "$KOS" | sed "s|^$T|  OK  |"
          KO_COUNT=$(printf '%s\n' "$KOS" | grep -c '\.ko' || true)
          [ "$KO_COUNT" -ge 2 ] || { echo "  MISS tun.ko / mtd-rw.ko"; fail=1; }

          # FILES 覆盖生效？sing-box 必须是官方 musl 二进制
          if [ "$(sha256sum "$T/usr/bin/sing-box" | cut -d' ' -f1)" = "$(sha256sum "$GITHUB_WORKSPACE/pkgs/sing-box-bin" | cut -d' ' -f1)" ]; then
            echo "  OK   sing-box = 官方 musl 二进制"
          else
            echo "  MISS sing-box 被包里的二进制覆盖回去了"; fail=1
          fi

          # easytier 必须 noweb 形态
          if [ -e "$T/usr/bin/easytier-web" ] || [ -e "$T/usr/bin/easytier-web-embed" ]; then
            echo "  MISS 出现 easytier-web，应为 noweb 形态"; fail=1
          else
            echo "  OK   easytier noweb 形态"
          fi

          [ "$fail" -eq 0 ] || { echo "ERROR: rootfs 校验失败"; exit 1; }

          # ---------- 收集产物 ----------
          OUT="$GITHUB_WORKSPACE/out"; rm -rf "$OUT"; mkdir -p "$OUT"
          cp -f "$IMG/${BASE}-squashfs-sysupgrade.bin" "$OUT/"
          if [ -s "$IMG/${BASE}-initramfs-uImage.itb" ]; then
            cp -f "$IMG/${BASE}-initramfs-uImage.itb" "$OUT/"
          fi
          {
            echo "device  : JDCloud ${DEVICE_NAME} (${PROFILE})"
            echo "openwrt : ${OPENWRT_VER}"
            echo "momo    : ${MOMO_REPO}"
            echo "sing-box: ${SINGBOX_TAG}"
            echo "easytier: ${EASYTIER_TAG}"
            echo "lan ip  : ${LAN_IP}"
            echo "build   : $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "packages: ${PKGS_FINAL}"
          } > "$OUT/build-info.txt"
          ( cd "$OUT" && sha256sum * > sha256sums.txt && cat build-info.txt && ls -lh )

      - name: Upload Firmware To Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: OpenWrt JDCloud Taiyi RE-CS-07 (snapshot + LuCI + momo + easytier)
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: out/*
          body: |
            JDCloud 太乙 RE-CS-07 / IPQ6018 / 2G RAM / 8G eMMC / 1WAN+3LAN 千兆 / 无 WiFi
            OpenWrt snapshot：${{ env.OPENWRT_VER }}（profile `jdcloud_re-cs-07`）
            默认 LAN：${{ env.LAN_IP }}，主机名 Taiyi，LuCI 默认中文

            预装：
            - LuCI 完整界面（luci-base + mod-network/system/status + bootstrap 主题 + uhttpd + rpcd）
            - momo + luci-app-momo + 中文包：LuCI「服务 → Momo」里配置，支持 Redirect / TPROXY / TUN
            - sing-box ${{ env.SINGBOX_TAG }}：包来自 feed（提供 init/config），二进制换成官方 linux-arm64-musl
            - EasyTier ${{ env.EASYTIER_TAG }}（noweb：core + cli）+ luci-app-easytier + 中文翻译
            - kmod-tun / kmod-mtd-rw / kmod-inet-diag / kmod-nft-tproxy / kmod-nft-socket / kmod-nft-nat / kmod-nft-fib

            刷机：
            1. 需第三方 U-Boot（uboot-ipq60xx-emmc-jdcloud_re-cs-07.bin，machid 0x8030202；不要用 cs-02 的）
            2. 官方 profile 没有 factory：先在 U-Boot 里引导 initramfs-uImage.itb
               （若本次没有 initramfs 附件，用 downloads.openwrt.org 同 snapshot 的 initramfs 引导即可，
                它只负责把系统跑起来，写完 sysupgrade 后就被覆盖）
            3. 进系统后 `sysupgrade -n <squashfs-sysupgrade.bin>` 写 eMMC（首次刷写不要保留配置）

            momo：打开 http://${{ env.LAN_IP }} → 服务 → Momo，粘贴 sing-box 配置/订阅，选 TUN 或 TPROXY 后启用；
            升级 sing-box 用 `apk add --upgrade sing-box`，不要换回 glibc 版二进制。

            easytier：服务 → EasyTier 里配置启用（easytier-core 已就位）。
            kmod-mtd-rw：`insmod mtd-rw i_want_a_brick=1`（临时解除写保护，机器不再「防砖」）。

            建议关掉硬件卸载（momo/TUN/easytier 都在用户态，offload 帮不上忙还可能绕过规则）：
            ```
            uci set network.@device[0].packet_steering='0'
            uci set firewall.@defaults[0].flow_offloading='0'
            uci set firewall.@defaults[0].flow_offloading_hw='0'
            uci commit && /etc/init.d/network reload && /etc/init.d/firewall restart
            ```

            注意：snapshot 与 momo 源都是滚动版本；社区反馈主线固件曾缺 f2fs 导致 overlay 不持久化，
            刷完请先验证「改配置 → 重启 → 配置是否保留」。
